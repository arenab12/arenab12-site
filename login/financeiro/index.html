<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Arena B12 — Financeiro 2026</title>
<meta name="theme-color" content="#FFFFFF"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="B12 Financeiro"/>
<link rel="manifest" href="../manifest.json"/>
<link rel="apple-touch-icon" href="../icon-192.png"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>if(window.Chart){Chart.defaults.font.family="Archivo, system-ui, sans-serif";Chart.defaults.color="#6C655B";}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  /* Mesmo visual da Gestão de quadras, sempre no tema claro */
  --bg:#F4F2EE;--surf:#FFFFFF;--surf2:#F1EEE9;--surf3:#ECE8E2;
  --border:#DDD7CE;--border2:#CFC8BD;
  --orange:#FF620B;--orange-bg:#FFE7D8;
  --green:#1E844A;--green-bg:#DCF1E3;
  --red:#BF3328;--red-bg:#F9E0DD;
  --blue:#2F6FB5;--blue-bg:#E2ECF7;
  --yellow:#A86300;--yellow-bg:#FBEED3;
  --text:#1C1A17;--muted:#6C655B;--muted2:#9A9288;
  --desp:#B9B1A6;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-weight:400;font-size:15px;min-height:100vh}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.95);backdrop-filter:blur(12px);border-bottom:2px solid var(--orange);display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;padding:8px 20px;min-height:62px}
/* Telas médias: botões do topo ficam mais compactos antes de precisar quebrar linha */
@media(max-width:1380px){.topbar .nav-btn{padding:6px 8px;font-size:12px}}
/* Ainda menor: logo + ano/Excel/Sync/Sair na 1ª linha, abas de navegação inteiras na 2ª linha */
@media(min-width:601px) and (max-width:1300px){
  .topbar::before{content:'';order:4;flex-basis:100%;height:0}
  .topbar .nav-btn{order:5}
  .topbar{padding-bottom:6px}
}
.brand-block{display:flex;flex-direction:column;justify-content:center;margin-right:auto}
.logo{height:20px;width:auto;display:block}
.topbar-sub{color:var(--muted);font-size:9px;letter-spacing:1.5px;margin-top:2px}
.nav-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;font-size:13px;font-weight:700;letter-spacing:1px;font-family:var(--f-body);cursor:pointer;border:none;background:none;color:var(--muted);border-radius:4px;transition:all .15s;white-space:nowrap}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{background:var(--orange);color:#fff}
.nav-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.year-sel{background:var(--surf2);border:1px solid var(--border2);color:var(--text);padding:4px 2px 4px 8px;border-radius:4px;font-size:12px;font-family:var(--f-body);font-weight:400;margin-left:8px;cursor:pointer;width:82px}
.btn-sync{display:flex;align-items:center;gap:5px;background:none;border:1px solid #333;color:var(--muted);border-radius:4px;padding:5px 12px;font-size:12px;font-weight:700;font-family:var(--f-body);letter-spacing:1px;cursor:pointer;transition:all .15s;margin-left:4px}
.btn-sync:hover{border-color:var(--green);color:var(--green)}
.btn-sync.syncing{border-color:var(--orange);color:var(--orange);animation:spin .8s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.btn-logout{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:4px;transition:color .15s;margin-left:4px}
.btn-logout:hover{color:var(--red)}
.btn-logout svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* MONTH NAV */
/* Desktop: barra lateral vertical fixa à esquerda */
.app-body{display:flex;align-items:flex-start}
.app-body>.main{flex:1;min-width:0}
.monthnav{position:sticky;top:var(--topbar-h,62px);width:180px;flex-shrink:0;height:calc(100vh - var(--topbar-h,62px));overflow-y:auto;display:flex;flex-direction:column;justify-content:space-between;gap:12px;border-right:1px solid var(--border);background:var(--surf);padding:16px 0 14px}
.mnav-title{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);font-family:var(--f-body);padding:0 18px 10px}
.mnav-left{display:flex;flex-direction:column;gap:0}
.mnav-btn{width:100%;padding:9px 16px 9px 15px;font-size:13px;font-weight:700;letter-spacing:1.5px;font-family:var(--f-body);cursor:pointer;border:none;border-left:3px solid transparent;background:none;color:var(--muted);text-align:left;white-space:nowrap;transition:all .15s;display:flex;flex-direction:column;gap:3px}
.mnav-btn:hover{color:#bbb;background:var(--surf2)}
.mnav-btn.active{color:var(--orange);border-left-color:var(--orange);background:var(--orange-bg)}
.mnav-row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.mnav-res{font-size:11px;font-weight:400;letter-spacing:.5px}
.mnav-res.pos{color:var(--green)}
.mnav-res.neg{color:var(--red)}
.mnav-btn .cnt{font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.5px}
.mnav-btn .dot{display:none;width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
.mnav-btn .dot.neg{background:var(--red)}
.mnav-right{display:flex;align-items:center;padding:0 14px}
.mnav-right .btn-danger-sm{width:100%;justify-content:center}
.btn-danger-sm{display:flex;align-items:center;gap:4px;background:none;border:1px solid rgba(255,68,68,.3);color:var(--red);padding:4px 10px;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:1px;font-family:var(--f-body);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-danger-sm:hover{background:var(--red-bg)}
.btn-danger-sm svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* MAIN */
/* .main é um "container": os blocos abaixo se ajustam ao espaço REAL disponível
   (tela menos a barra lateral), não à largura da janela — assim nada é cortado. */
.main{padding:0;max-width:100%;container-type:inline-size;container-name:main}

/* KPI STRIP — 2 colunas (estreito) → 4 colunas → 8 colunas (telas muito largas).
   As linhas divisórias vêm do gap de 1px sobre o fundo cinza, então ficam certas em qualquer nº de colunas. */
.kpi-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.kpi{padding:22px 20px;background:var(--bg);min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.kpi-label{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:8px;font-family:var(--f-body);font-weight:400}
/* Fonte do valor encolhe junto com a coluna (cqi = 1% da largura do container) */
.kpi-val{font-size:clamp(14px,calc(5.2cqi - 4px),22px);white-space:nowrap;font-weight:900;font-family:var(--f-body);letter-spacing:-0.3px;line-height:1}
@container main (min-width:720px){
  .kpi-strip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpi-val{font-size:clamp(14px,calc(2.45cqi - 4px),24px)}
}
@container main (min-width:1900px){
  .kpi-strip{grid-template-columns:repeat(8,minmax(0,1fr))}
  .kpi-val{font-size:clamp(14px,calc(1.12cqi - 3px),24px)}
}
.kpi-val.g{color:var(--green)}.kpi-val.r{color:var(--red)}.kpi-val.o{color:var(--orange)}.kpi-val.b{color:var(--blue)}.kpi-val.w{color:#fff}.kpi-val.y{color:var(--yellow)}
.kpi-sub{font-size:12px;color:var(--muted2);margin-top:6px}

/* CHARTS GRID */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border)}
@media(max-width:700px){.charts-grid{grid-template-columns:1fr}}
.charts-grid>*{min-width:0}
/* Espaço estreito: Receitas e Despesas ficam uma embaixo da outra */
@container main (max-width:960px){
  .charts-grid{grid-template-columns:1fr}
  .charts-grid>.chart-panel{border-right:none;border-bottom:1px solid var(--border)}
  .charts-grid>.chart-panel:last-child{border-bottom:none}
}
.chart-panel{padding:32px 32px;border-right:1px solid var(--border);container-type:inline-size}
/* Painel estreito: legenda desce para baixo do donut em vez de vazar para fora */
@container (max-width:600px){
  .donut-wrap{flex-direction:column;align-items:center;gap:18px}
  .donut-wrap .legend{width:100%}
}
.chart-panel:last-child,.charts-grid > .chart-panel:nth-child(2){border-right:none}
.panel-hdr{display:flex;align-items:center;gap:7px;margin-bottom:20px}
.panel-hdr-icon{color:var(--orange);font-size:13px}
.panel-hdr-title{font-size:11px;letter-spacing:2.5px;color:var(--muted);font-family:var(--f-body);font-weight:700}
.donut-wrap{display:flex;align-items:flex-start;gap:28px}
.legend{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.legend-row{display:flex;align-items:center;gap:10px;font-size:14px}
.ldot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lname{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.lval{font-weight:400;font-family:var(--f-body);font-size:16px;color:#fff;flex-shrink:0;min-width:120px;text-align:right}
/* Painel bem estreito (celular): legenda um pouco menor para os nomes caberem */
@container (max-width:420px){
  .lname{font-size:12px}
  .lval{font-size:13px;min-width:0}
}

/* ANNUAL */
.annual-section{border-bottom:1px solid var(--border);padding:28px 28px}
.annual-bars{display:flex;align-items:flex-end;height:120px;gap:0;margin-top:16px}
.annual-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
/* Pouco espaço (celular): barras e rótulos do gráfico anual encolhem para caber os 12 meses */
@container main (max-width:560px){
  .annual-section{padding:22px 12px}
  .bar-in,.bar-out{width:7px}
  .bar-pair{gap:2px}
  .annual-col-label{font-size:8px;letter-spacing:0}
  .annual-col-val{font-size:7px;letter-spacing:-.3px}
}
.bar-pair{display:flex;gap:3px;align-items:flex-end;height:105px}
.bar-in,.bar-out{width:12px;border-radius:2px 2px 0 0;min-height:2px;transition:height .4s cubic-bezier(.4,0,.2,1)}
.bar-in{background:var(--green)}.bar-out{background:var(--red)}
.annual-col-label{font-size:11px;letter-spacing:1px;color:var(--muted);font-family:var(--f-body);font-weight:400}
.annual-col-val{font-size:12px;color:var(--muted2);font-family:var(--f-body);font-weight:300}

/* INSIGHTS */
.insights-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
@media(max-width:700px){.insights-strip{grid-template-columns:repeat(2,1fr)}}
.insight{padding:20px 22px;border-right:1px solid var(--border);font-size:13px;color:var(--muted)}
.insight:last-child{border-right:none}
.insight b{color:var(--orange)}
.insight b.g{color:var(--green)}.insight b.r{color:var(--red)}.insight b.w{color:#fff}

/* ANALYTICS CHARTS */
.analytics-section{border-top:1px solid var(--border);padding:28px 28px}
.analytics-tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0}
.atab{flex:0 1 auto;min-width:0;padding:8px clamp(8px,2.5cqi,18px);font-size:12px;font-weight:700;letter-spacing:1px;font-family:var(--f-body);cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s}
.atab:hover{color:var(--text)}
.atab.active{color:var(--orange);border-bottom-color:var(--orange)}
.analytics-controls{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.analytics-controls label{font-size:11px;letter-spacing:1px;color:var(--muted);font-family:var(--f-body);font-weight:400}
.analytics-controls select{width:auto;min-width:140px;font-size:13px;padding:6px 10px}
.chart-toggle{display:flex;background:var(--surf2);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.chart-toggle button{background:none;border:none;color:var(--muted);padding:5px 12px;font-size:11px;font-family:var(--f-body);font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s}
.chart-toggle button.active{background:var(--orange);color:#fff}
.chart-full{position:relative;width:100%;height:320px}
.tab-content{padding:28px}
.section-card{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:24px 28px;margin-bottom:18px}
.section-hdr{font-size:11px;letter-spacing:2.5px;color:var(--muted);font-family:var(--f-body);font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.form-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
@media(max-width:700px){.form-grid-4{grid-template-columns:1fr 1fr}}
.form-group label{display:block;font-size:11px;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px;font-family:var(--f-body);font-weight:400}
input,select,textarea{width:100%;background:var(--surf2);border:1px solid var(--border2);border-radius:4px;color:var(--text);padding:10px 12px;font-size:14px;font-family:var(--f-body);font-weight:400;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--orange)}
.btn-primary{display:flex;align-items:center;gap:5px;background:var(--orange);color:#fff;border:none;border-radius:4px;padding:8px 18px;font-size:13px;font-weight:700;font-family:var(--f-body);letter-spacing:1px;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.4;cursor:default}
.btn-outline{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--border2);color:var(--muted);padding:8px 16px;border-radius:4px;font-size:13px;font-weight:700;font-family:var(--f-body);letter-spacing:1px;cursor:pointer;transition:all .15s}
.btn-outline:hover{border-color:#444;color:var(--text)}
.btn-success{display:flex;align-items:center;gap:5px;background:var(--green);color:#000;border:none;border-radius:4px;padding:8px 18px;font-size:13px;font-weight:700;font-family:var(--f-body);letter-spacing:1px;cursor:pointer;transition:opacity .15s}
.btn-success:hover{opacity:.85}
.dropzone{border:1px dashed #2a2a2a;border-radius:6px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s;position:relative}
.dropzone:hover,.dropzone.drag{border-color:var(--orange)}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dropzone-icon{font-size:24px;color:var(--muted);margin-bottom:6px}
.dropzone-text{font-size:14px;color:var(--muted)}
.dropzone-text b{color:var(--orange)}

/* PREVIEW TABLE */
.preview-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.preview-label{font-size:11px;letter-spacing:2px;color:var(--muted);font-family:var(--f-body);font-weight:400}
.preview-actions{display:flex;gap:8px}
/* Tabela da pré-visualização: cada coluna do tamanho do seu conteúdo; a descrição ocupa o que sobra */
.preview-tbl{width:100%;table-layout:auto}
.preview-tbl .pv-nw{white-space:nowrap}
.preview-tbl .pv-desc{width:100%;min-width:180px;word-break:break-word;line-height:1.4}
.preview-tbl .pv-cat{min-width:250px}
.tbl-wrap{overflow-x:auto;max-height:calc(100vh - 300px);overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:11px 10px;font-size:11px;letter-spacing:1.5px;color:var(--muted);border-bottom:1px solid var(--border);font-family:var(--f-body);font-weight:700;position:sticky;top:0;background:var(--surf);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--border);color:#ccc}
tr:hover td{background:var(--surf2)}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:400;letter-spacing:.5px;font-family:var(--f-body);white-space:nowrap}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid rgba(0,230,118,.2)}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,68,68,.2)}
.badge-blue{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(79,195,247,.2)}
.badge-orange{background:var(--orange-bg);color:var(--orange);border:1px solid rgba(255,98,11,.2)}
.badge-gray{background:var(--surf3);color:var(--muted);border:1px solid var(--border2)}
.val-pos{color:var(--green);font-weight:400}
.val-neg{color:var(--red);font-weight:400}
.val-neu{color:var(--blue);font-weight:400}
.btn-icon{background:none;border:none;cursor:pointer;padding:3px 5px;border-radius:3px;transition:all .15s;color:var(--muted);display:inline-flex;align-items:center}
.btn-icon:hover.edit{color:var(--blue);background:var(--blue-bg)}
.btn-icon:hover.del{color:var(--red);background:var(--red-bg)}
.btn-icon svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.filter-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filter-row input,.filter-row select{flex:1;min-width:120px}
.src-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.src-chip{display:flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid rgba(255,68,68,.3);color:var(--red);border-radius:4px;font-size:12px;font-weight:700;font-family:var(--f-body);cursor:pointer;transition:all .15s;background:none}
.src-chip:hover{background:var(--red-bg)}
.src-chip svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lnc-totals{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-body);font-weight:800;font-size:15px}
/* Fornecedores: formulário de adicionar (3 colunas; empilha quando estreito) */
.forn-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
@container main (max-width:560px){.forn-add{grid-template-columns:minmax(0,1fr)}}
th button{background:none;border:none;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-size:11px;letter-spacing:1.5px;font-family:var(--f-body);font-weight:700}
th button svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2}

/* DRE */
.dre-wrap{overflow-x:auto}
.dre-table{min-width:1000px}
.dre-table td,.dre-table th{text-align:right;padding:9px 6px;font-family:var(--f-body);font-weight:300;font-size:11px;white-space:nowrap}
.dre-table td:first-child,.dre-table th:first-child{text-align:left;min-width:180px;font-size:13px}
.dre-table tr.section td{font-weight:500;font-size:12px;background:var(--surf2)}
.dre-table tr:hover td{background:var(--surf2)}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.open{display:flex}
.modal{background:var(--surf);border:1px solid var(--border2);border-radius:8px;padding:32px;width:520px;max-width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-family:var(--f-body);font-size:16px;letter-spacing:2px;color:var(--orange);margin-bottom:18px;display:flex;align-items:center;gap:8px;font-weight:700}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:420px){.modal-grid{grid-template-columns:1fr}}

/* TOAST */

.toast.show{transform:translateY(0);opacity:1}

.warn-box{background:var(--red-bg);border:1px solid rgba(255,68,68,.25);border-radius:4px;padding:10px 14px;font-size:13px;color:var(--red);display:flex;align-items:center;gap:7px;margin-bottom:10px}

.info-box{background:var(--blue-bg);border:1px solid rgba(79,195,247,.2);border-radius:4px;padding:10px 14px;margin-bottom:10px}

/* ═══════════════════ MOBILE (≤600px) ═══════════════════ */
@media(max-width:600px){
  /* TOPBAR em duas linhas: controles em cima, navegação rolável embaixo */
  .topbar{
    height:auto;min-height:auto;padding:8px 10px 0 10px;
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  }
  .brand-block{order:1}
  .topbar-sub{display:none}

  .btn-logout{display:flex;order:3}
  /* Navegação: botões fluem em linhas, ocupando a largura disponível */
  .nav-btn{
    order:4;flex:1 1 auto;min-width:30%;justify-content:center;
    padding:10px 8px;font-size:12px;gap:5px;
  }

  /* KPIs: 2 colunas, mais ar */
  .kpi{padding:16px 14px}
  .kpi-label{font-size:10px}
  .kpi-sub{font-size:11px}

  /* Mês: botões maiores p/ tocar com o dedo */
  /* (layout horizontal do mês no celular fica na regra ≤760px abaixo) */
  .mnav-btn{padding:12px 14px;font-size:13px}

  /* Conteúdo das abas: menos padding */
  .tab-content{padding:14px}
  .section-card{padding:16px 14px}

  /* Gráficos: empilha e ocupa largura toda */
  .charts-grid{grid-template-columns:1fr}
  .chart-panel{padding:18px 14px}
  .chart-full{height:260px}
  .analytics-section{padding:18px 14px}
  .analytics-controls{gap:8px}
  .analytics-controls select{min-width:0;flex:1}

  /* Insights: 1 coluna */
  .insights-strip{grid-template-columns:1fr!important}

  /* TABELAS: viram scroll horizontal suave dentro de um container */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:6px}
  table{font-size:12px;min-width:520px}
  th,td{padding:8px 8px}

  /* Forms: 1 coluna, inputs maiores */
  .form-grid,.form-grid-4{grid-template-columns:1fr!important}
  input,select,textarea{font-size:16px;padding:11px 12px} /* 16px evita zoom no iOS */

  /* Modais: ocupam quase a tela toda */
  .modal{width:94vw!important;max-width:94vw!important;padding:22px 18px}

  /* Donuts: empilha legenda embaixo */
  .donut-wrap{flex-direction:column;align-items:center;gap:16px}
  .donut-wrap canvas{margin:0 auto}

  /* Botão de sair fica visível — agora volta pro login, não fecha mais a janela */
  .btn-logout{display:flex}
}

<script>
const supa = window.supabase.createClient(
  'https://zryazxwxrufzeyaoeqbm.supabase.co',
  'sb_publishable_Hux6NxPxXSMnb1gW5gDXzA_j5ja3bhN'
);

window.b12Check = async function(){
  var email = document.getElementById('b12Email').value.trim();
  var pass = document.getElementById('b12Pass').value;
  var btn = document.getElementById('b12BtnEntrar');
  var errEl = document.getElementById('b12Err');
  if(!email || !pass){ errEl.textContent='Preencha e-mail e senha.'; return; }
  btn.disabled = true; btn.textContent = 'ENTRANDO...';
  const { error } = await supa.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = 'ENTRAR →';
  if(error){
    errEl.textContent = 'E-mail ou senha incorretos.';
    setTimeout(function(){ errEl.textContent=''; }, 2500);
    document.getElementById('b12Pass').value='';
    document.getElementById('b12Pass').focus();
    return;
  }
  document.getElementById('b12LoginScreen').style.display='none';
  document.getElementById('b12Pass').value='';
  if(window.b12Start) window.b12Start();
};
</script>

(function(){

  function upd(){ document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight+'px'); }

<script>
// ═══════════════════════════════════════════════════════════════════
// CONSTANTES
// ═══════════════════════════════════════════════════════════════════
const MESES_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_FULL  = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const INCOME_CATS = ['Locação Quadra 1','Locação Quadra 2','Locação Quadra Areia','Receita Bebidas','Receita Alimentos','Outras Receitas','Entrada de Caixa'];
const EXPENSE_CATS = ['Estoque','Despesas Fixas','Despesas Variáveis','Investimentos e Empréstimo','Retirada dos Sócios'];
const NEUTRAL_CATS = ['Pix Interna','Aplicação Financeira'];
const ALL_CATS = [...INCOME_CATS, ...EXPENSE_CATS];
// SAÍDAS SIMPLIFICADAS em 5 blocos (as receitas continuam como estavam).
// Lançamentos com as categorias antigas são convertidos ao carregar e regravados no banco (uma vez só).
const ESTOQUE_CAT = 'Estoque';
const LEGACY_CAT_MAP = {
  'Reposição de Estoque': 'Estoque',
  'Reposição de Estoque - Bebidas': 'Estoque',
  'Reposição de Estoque - Alimentos': 'Estoque',
  'Reposição de Estoque - Outros': 'Estoque',
  'Pagamento de Contas': 'Despesas Fixas',
  'Folha de Pagamento': 'Despesas Fixas',
  'Contabilidade': 'Despesas Fixas',
  'Outras Despesas': 'Despesas Variáveis',
  'Manutenção Quadras': 'Despesas Variáveis',
  'Serviços Terceiros': 'Despesas Variáveis',
  'Impostos e Taxas': 'Despesas Variáveis',
  'Marketing': 'Despesas Variáveis',
  'Investimentos': 'Investimentos e Empréstimo',
  'Retirada G': 'Retirada dos Sócios',
  'Retirada R': 'Retirada dos Sócios',
};
// desc (opcional): correções pontuais que dependem da descrição
function normCat(c, desc){
  // Pagamento final da energia solar estava como "Aplicação Financeira" (neutro), mas é dinheiro que saiu
  if(c==='Aplicação Financeira' && desc && /SOLTURI/i.test(desc)) return 'Investimentos e Empréstimo';
  return (c && LEGACY_CAT_MAP[c]) || c;
}

const CHART_COLORS = ['#FF620B','#2F6FB5','#1E844A','#D99A00','#C2477A','#6FA65A','#2E8C85','#E0875A','#8A5BB0','#8C7466'];

const SOURCES = [
  {id:'consumer', label:'📊 Consumer (Bar)', hint:'Histórico de Itens Vendidos'},
  {id:'webquadras', label:'🏟 WebQuadras', hint:'Pagamentos exportados'},
  {id:'inter', label:'🏦 Banco Inter', hint:'Extrato Conta Corrente'},
  {id:'pagseguro', label:'💳 PagSeguro', hint:'Extrato da Conta'},
];

// ═══════════════════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════════════════
let currentTab = 'dashboard';
let currentYear = 2026;
let selMonth = 2; // 0-indexed
let allTxns = []; // [{id,date,desc,value,type,category,source,month(0-idx)}]
let pendingTxns = [];
let pendingEditCats = {};
let editingTxn = null;
let confirmCallback = null;
let dupCallback = {onContinue:null, onReplace:null};
let chartRec=null, chartExp=null;
let GAS_URL = 'supabase'; // sentinel sempre "ligado" — o backend real agora é o Supabase (ver funções gas* abaixo), mantido com esse nome só para não precisar editar todos os pontos que checam "if(GAS_URL)"
let customMap = {};
let pendingReplace = null; // {ids,label} — lançamentos a remover quando a importação for confirmada
try{customMap=JSON.parse(localStorage.getItem('arenab12_customMap')||'{}'); Object.keys(customMap).forEach(k=>{customMap[k]=normCat(customMap[k]);});}catch(e){}

// Sort state for lancamentos
let sortKey='date', sortDir='asc';
let filterDesc='', filterCat='__all__', filterType='__all__', filterSrc='__all__';

// ═══════════════════════════════════════════════════════════════════
// FORMATTERS
// ═══════════════════════════════════════════════════════════════════
function fmtK(v){
  if(v===undefined||v===null||isNaN(v)) return '—';
  return 'R$\u00a0'+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtFull(v){
  if(v===undefined||v===null||isNaN(v)) return '—';
  return 'R$\u00a0'+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtPct(v){ return isNaN(v)?'—':Math.round(v*100)+'%'; }

// ═══════════════════════════════════════════════════════════════════
// SUPABASE (backend) — mesmas assinaturas/nomes de função de antes
// (gasRead/gasStats/gasWrite/gasWriteMonths/gasMergeTxns) pra não precisar
// mexer em cada lugar do código que já chama essas funções.
// ═══════════════════════════════════════════════════════════════════
function txnToRow(t){
  return {
    id: String(t.id),
    date: t.date,
    description: t.desc||'',
    value: t.value||0,
    type: t.type,
    category: t.category||null,
    source: t.source||null,
    month: t.month,
    year: t.year||currentYear,
  };
}
function rowToTxn(r){
  return {
    id: r.id,
    date: cleanDate(r.date),
    desc: r.description,
    value: r.value,
    type: r.type,
    category: normCat(r.category, r.description),
    source: r.source,
    month: r.month,
    year: r.year,
  };
}

// O Supabase devolve no máximo ~1000 linhas por consulta. Sem paginar, tudo além disso
// "sumia" da tela (os dados continuavam no banco). Aqui buscamos em páginas até acabar.
async function selectAllTxns(year){
  const PAGE = 1000;
  let all = [];
  for(let from = 0; ; ){
    let q = supa.from('txns').select('*').order('id', {ascending:true}).range(from, from + PAGE - 1);
    if(year) q = q.eq('year', year);
    const { data, error } = await q;
    if(error) throw error;
    if(!data || data.length === 0) break;
    all = all.concat(data);
    from += data.length;          // avança pelo que veio (funciona mesmo se o limite do servidor for menor que PAGE)
    if(from > 200000) break;      // trava de segurança
  }
  return all;
}

async function gasRead(year){
  try{
    const data = await selectAllTxns(year||currentYear);
    return { txns: (data||[]).map(rowToTxn) };
  }catch(e){ console.error('gasRead error:', e); return null; }
}

async function gasStats(){
  try{
    const { data, error } = await supa.from('txns').select('year');
    if(error) throw error;
    const by_year = {};
    (data||[]).forEach(r=>{ by_year[r.year] = (by_year[r.year]||0)+1; });
    return { by_year };
  }catch(e){ console.error('gasStats error:', e); return null; }
}

async function gasWrite(txns){
  try{
    if(!txns || txns.length===0) return true;
    const rows = txns.map(txnToRow);
    const { error } = await supa.from('txns').upsert(rows, {onConflict:'id'});
    if(error) throw error;
    return true;
  }catch(e){ console.error('gasWrite error:', e); return false; }
}

// Substitui por completo os lançamentos de cada mês informado
// (apaga do banco o que não estiver mais na lista daquele mês/ano)
async function gasWriteMonths(year, monthsObj){
  try{
    for(const m of Object.keys(monthsObj)){
      const list = monthsObj[m]||[];
      const ids = list.map(t=>String(t.id));
      let del = supa.from('txns').delete().eq('year', year).eq('month', parseInt(m));
      del = ids.length>0 ? del.not('id','in',`(${ids.join(',')})`) : del;
      const { error: delErr } = await del;
      if(delErr) throw delErr;
      if(list.length>0){
        const rows = list.map(txnToRow);
        const { error } = await supa.from('txns').upsert(rows, {onConflict:'id'});
        if(error) throw error;
      }
    }
    return true;
  }catch(e){ console.error('gasWriteMonths error:', e); return false; }
}

// MERGE: grava só os lançamentos novos/alterados e apaga os removidos —
// nunca mexe no resto da tabela (nem no que outro dispositivo já salvou).
async function gasMergeTxns(year, txnsList, deletedIds){
  try{
    if(txnsList && txnsList.length>0){
      const rows = txnsList.map(txnToRow);
      const { error } = await supa.from('txns').upsert(rows, {onConflict:'id'});
      if(error) throw error;
    }
    if(deletedIds && deletedIds.length>0){
      const { error } = await supa.from('txns').delete().in('id', deletedIds.map(String));
      if(error) throw error;
    }
    return true;
  }catch(e){ console.error('gasMergeTxns error:', e); return false; }
}

async function loadTxnsFromSupabase(){
  try{
    const data = await selectAllTxns();
    allTxns = (data||[]).map(rowToTxn);
    lsSave();
    // Migração única: regrava no banco os lançamentos que ainda estavam com categoria antiga
    // (ex.: "Reposição de Estoque - Bebidas" → "Reposição de Estoque"). Nas próximas cargas não sobra nada.
    const legacyIds = new Set((data||[]).filter(r=>r.category && normCat(r.category, r.description)!==r.category).map(r=>String(r.id)));
    if(legacyIds.size>0){
      const toFix = allTxns.filter(t=>legacyIds.has(String(t.id)));
      (async()=>{
        let ok = true;
        for(let i=0; i<toFix.length && ok; i+=400) ok = await gasWrite(toFix.slice(i,i+400));
        if(ok) addLog('MIGRAÇÃO', `${toFix.length} lançamentos convertidos para os 5 blocos de saída`, false);
        else console.warn('Migração de categorias falhou — será tentada de novo na próxima carga.');
      })();
    }
    return true;
  }catch(e){
    console.error('loadTxnsFromSupabase error:', e);
    lsLoad();
    return false;
  }
}

// ═══════════════════════════════════════════════════════════════════
// LOCAL STORAGE (fallback / cache)
// ═══════════════════════════════════════════════════════════════════
function lsKey(){ return `arenab12_txns_all`; }
function lsSave(){ localStorage.setItem(lsKey(), JSON.stringify(allTxns)); }

// Salva localmente E envia para Sheets automaticamente
// affectedYear/Month opcionais para push eficiente (só o mês alterado)
function lsSaveAndSync(affectedYear, affectedMonth){
  lsSave();
  if(!GAS_URL) return;
  if(affectedYear !== undefined && affectedMonth !== undefined){
    // Push eficiente: só o mês alterado
    const monthTxns = allTxns.filter(t=>t.year===affectedYear && t.month===affectedMonth);
    gasWriteMonths(affectedYear, {[affectedMonth]: monthTxns});
  } else {
    // Push do ano atual inteiro
    const byMonth={};
    allTxns.filter(t=>t.year===currentYear).forEach(t=>{
      if(!byMonth[t.month]) byMonth[t.month]=[];
      byMonth[t.month].push(t);
    });
    if(Object.keys(byMonth).length>0) gasWriteMonths(currentYear, byMonth);
  }
}
function lsLoad(){
  try{
    const d=localStorage.getItem(lsKey());
    if(d){ allTxns=JSON.parse(d); allTxns.forEach(t=>{ t.category=normCat(t.category, t.desc); }); }
    else {
      // migrate old per-year keys
      let migrated=[];
      for(let y=2025;y<=2032;y++){
        const old=localStorage.getItem(`arenab12_txns_${y}`);
        if(old){ try{ migrated=[...migrated,...JSON.parse(old)]; localStorage.removeItem(`arenab12_txns_${y}`); }catch(e){} }
      }
      if(migrated.length>0){ allTxns=migrated; lsSave(); }
    }
  }catch(e){}
}

function txnsForMonth(m){ return allTxns.filter(t=>t.month===m && t.year===currentYear); }

function computeSummary(txns){
  const income={}, expense={};
  INCOME_CATS.forEach(c=>income[c]=0);
  EXPENSE_CATS.forEach(c=>expense[c]=0);
  let totalIn=0, totalOut=0;
  txns.forEach(t=>{
    const v=t.value||0, c=normCat(t.category, t.desc)||'';
    if(t.type==='entrada'&&!NEUTRAL_CATS.includes(c)){
      income[c]=(income[c]||0)+v; totalIn+=v;
    } else if(t.type==='saida'&&!NEUTRAL_CATS.includes(c)){
      expense[c]=(expense[c]||0)+v; totalOut+=v;
    }
  });
  const bar = (income['Receita Bebidas']||0)+(income['Receita Alimentos']||0);
  const quadra = (income['Locação Quadra 1']||0)+(income['Locação Quadra 2']||0)+(income['Locação Quadra Areia']||0);
  const lucro = totalIn-totalOut;
  const mb = totalIn>0?(totalIn-(expense[ESTOQUE_CAT]||0))/totalIn:0;
  const ml = totalIn>0?lucro/totalIn:0;
  const coefBarLoc = quadra>0?bar/quadra:0;
  const estoqueTotal=expense[ESTOQUE_CAT]||0;
  const coefEstoqueBar = bar>0?estoqueTotal/bar:0;
  return {income,expense,totalIn,totalOut,bar,quadra,lucro,mb,ml,coefBarLoc,coefEstoqueBar};
}

// Sincronizar agora = buscar o estado mais atual direto do Supabase
// (o Postgres já é a fonte única de verdade; não precisa mais de merge manual)
async function syncFromGas(silent=false){
  try{
    if(!silent) showToast('Sincronizando...', false, true);
    const ok = await loadTxnsFromSupabase();
    renderNav();
    renderMain();
    if(!silent){
      if(ok) showToast('✓ Sincronizado — '+allTxns.length+' lançamentos no total.');
      else showToast('Não foi possível conectar ao banco — mostrando dados salvos neste dispositivo.', true);
    }
  }catch(e){
    if(!silent) showToast('Erro de sincronização: '+e.message, true);
    console.error('syncFromGas error:', e);
  }
}

// Push inteligente: só envia os meses do ano que foram modificados
async function pushMonthToSheets(year, month){
  if(!GAS_URL) return;
  const monthTxns = allTxns.filter(t=>t.year===year && t.month===month);
  await gasWriteMonths(year, {[month]: monthTxns});
}

async function manualSync(){
  const btn = document.getElementById('btnSync');
  if(btn){ btn.classList.add('syncing'); btn.textContent='⟳ Sync'; }
  // Merge de verdade: envia os locais (sem apagar o do outro) e puxa o consolidado
  await syncFromGas(false);
  if(btn){ btn.classList.remove('syncing'); btn.textContent='⇄ Sync'; }
}

async function forcePushAll(){
  if(allTxns.length===0){ showToast('Nenhum dado local para enviar.', false, true); return; }
  showToast('Enviando '+allTxns.length+' lançamentos ao banco...', false, true);
  try{
    // Agrupa todos os lançamentos por ano+mês e envia
    const byYear = {};
    allTxns.forEach(t=>{
      const y = t.year||currentYear;
      const m = t.month;
      if(!byYear[y]) byYear[y]={};
      if(!byYear[y][m]) byYear[y][m]=[];
      byYear[y][m].push(t);
    });
    const years = Object.keys(byYear);
    let ok = true;
    for(const y of years){
      const res = await gasWriteMonths(parseInt(y), byYear[y]);
      if(!res) ok = false;
    }
    if(ok) showToast('✓ '+allTxns.length+' lançamentos enviados ao banco ('+years.length+' ano(s))!');
    else showToast('Envio parcial — tente novamente em instantes.', false, true);
  }catch(e){ showToast('Erro ao enviar: '+e.message, true); }
}

function drawDashCharts(){
  const monthTxns=txnsForMonth(selMonth);
  const s=computeSummary(monthTxns);
  function makeDonut(canvasId,legendId,entries){
    const vals=entries.map(e=>e.v), labels=entries.map(e=>e.l), colors=entries.map((_,i)=>CHART_COLORS[i%CHART_COLORS.length]);
    const c=document.getElementById(canvasId);
    const lg=document.getElementById(legendId);
    if(!c)return null;
    if(vals.every(v=>v===0)){lg.innerHTML='<span style="color:var(--muted);font-size:11px">Nenhum registro</span>';return null;}
    const chart=new Chart(c,{type:'doughnut',data:{labels,datasets:[{data:vals,backgroundColor:colors,borderWidth:0}]},options:{responsive:false,plugins:{legend:{display:false}},cutout:'66%'}});
    lg.innerHTML=entries.filter(e=>e.v>0).map((e,i)=>{
      const bg=CHART_COLORS[i%CHART_COLORS.length];
      const nm=e.l.replace('Locação ','').replace('Receita ','').replace('Reposição de Estoque','Estoque').replace(' de Pagamento','');
      return '<div class="legend-row"><span class="ldot" style="background:'+bg+'"></span><span class="lname">'+nm+'</span><span class="lval">'+fmtK(e.v)+'</span></div>';
    }).join('');
    return chart;
  }
  const incEntries=INCOME_CATS.map(c=>({l:c,v:s.income[c]||0})).filter(e=>e.v>0);
  const expEntries=EXPENSE_CATS.filter(c=>!NEUTRAL_CATS.includes(c)).map(c=>({l:c,v:s.expense[c]||0})).filter(e=>e.v>0);
  chartRec=makeDonut('chartRec','legendRec',incEntries);
  chartExp=makeDonut('chartExp','legendExp',expEntries);
  redrawAnalytics();
}

function getMonthlyValues(year, tab, srcFilter){
  return MESES_SHORT.map((_,m)=>{
    const txns = allTxns.filter(t=>t.year===year && t.month===m);
    const s = computeSummary(txns);
    if(tab==='receitas'){
      if(srcFilter) return s.income[srcFilter]||0;
      return s.totalIn;
    } else if(tab==='despesas'){
      return s.totalOut;
    } else {
      return s.lucro;
    }
  });
}

function parseConsumer(wb, mesIdx){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{cellDates:true});
  // Soma TODA a coluna "Valor. Tot. Item" (sem filtro de status — inclui pedidos "Em Aberto").
  // Data do lançamento = ABERTURA do pedido ("Data Ab. Ped."). O relatório da Consumer separa os arquivos
  // por data de abertura, então cada planilha cai inteira no seu próprio mês (nada se perde na virada
  // e nada se mistura com o mês vizinho). Sem data de abertura → data do item → fechamento → dia 1 do mês.
  const toNum=v=>{
    if(typeof v==='number') return v;
    if(v===undefined||v===null||v==='') return 0;
    let t=String(v).replace(/[^\d,.-]/g,'');
    if(t.includes(',')) t=t.replace(/\./g,'').replace(',','.');   // formato BR "1.234,56"
    const n=parseFloat(t); return isNaN(n)?0:n;
  };
  const toDate=v=>{
    if(v instanceof Date) return isNaN(v)?null:v;
    if(!v) return null;
    const m=String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);       // "dd/mm/aaaa ..."
    if(m) return new Date(+m[3], +m[2]-1, +m[1]);
    const d=new Date(v); return isNaN(d)?null:d;
  };
  const groups={};
  rows.forEach(r=>{
    const cat=String(r['Cat. Prod.']||'').trim().toUpperCase();
    // Linha de total/rodapé (sem categoria, status e data) não é item vendido — ignorada para não somar em dobro
    if(!cat && !r['Stat. Ped.'] && !r['Data Fec. Ped.'] && !r['Data Ab. Ped.']) return;
    const v=toNum(r['Valor. Tot. Item']);
    if(!v) return;
    const d=toDate(r['Data Ab. Ped.'])||toDate(r['Data/Hora Item'])||toDate(r['Data Fec. Ped.']);
    const key=(cat||'OUTROS')+'|'+(d?`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`:'');
    groups[key]=(groups[key]||0)+v;
  });
  const catMap={'BEBIDAS':'Receita Bebidas','ALIMENTOS':'Receita Alimentos','DIVERSOS':'Outras Receitas'};
  return Object.entries(groups).map(([key,v])=>{
    const [cat,dt]=key.split('|');
    const mapped=catMap[cat]||'Outras Receitas';
    const [y,m]=dt?dt.split('-').map(Number):[currentYear,mesIdx+1];
    return mkTxn(dt?dtToDisplay(dt):`01/${pad(mesIdx+1)}/${currentYear}`, `Receita ${cat[0]+cat.slice(1).toLowerCase()} — Consumer`, v, 'entrada', mapped, 'Consumer', m-1, y);
  });
}

function parseWebQuadras(wb, mesIdx){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws);
  return rows.map(r=>{
    const dt=r['Data de Emissão']?new Date(r['Data de Emissão']):null;
    const mIdx=dt?dt.getMonth():mesIdx;
    const quadra=r['Quadra']||'';
    const catMap={'SOCIETY 1':'Locação Quadra 1','SOCIETY 2':'Locação Quadra 2','AREIA 1':'Locação Quadra Areia','AREIA 2':'Locação Quadra Areia','*EVENTO':'Outras Receitas'};
    const cat=Object.entries(catMap).find(([k])=>quadra.includes(k))?.[1]||'Outras Receitas';
    const clienteE=r['Nome do Cliente']||'';
    const cliente=clienteE.length>30?clienteE.slice(0,30)+'…':clienteE;
    const displayDt=dt?`${pad(dt.getDate())}/${pad(dt.getMonth()+1)}/${dt.getFullYear()}`:`01/${pad(mesIdx+1)}/${currentYear}`;
    return mkTxn(displayDt, `${cliente} — ${quadra} (${r['Tipo de Evento']||''})`, r['Valor']||0, 'entrada', cat, 'WebQuadras', mIdx);
  }).filter(t=>t.value>0);
}

function parseInter(wb, mesIdx){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,cellDates:true});
  // Header na linha 5: Data Lançamento | Descrição | Valor | Saldo
  // Saídas = valores negativos na coluna Valor (índice 2)
  return raw.slice(6).map(r=>{
    const rawDt = r[0];
    const desc  = String(r[1]||'').trim();
    const rawV  = parseFloat(String(r[2]||'').replace(',','.'));
    if(!desc || isNaN(rawV) || rawV === 0) return null;
    // Inter: só saídas (valores negativos)
    if(rawV > 0) return null;
    const val  = Math.abs(rawV);
    const type = 'saida';
    // Data
    let displayDt = `01/${pad(mesIdx+1)}/${currentYear}`;
    if(rawDt instanceof Date) displayDt = `${pad(rawDt.getDate())}/${pad(rawDt.getMonth()+1)}/${rawDt.getFullYear()}`;
    else if(rawDt && typeof rawDt==='string') {
      const p=rawDt.slice(0,10).split('-');
      if(p.length===3) displayDt=`${p[2]}/${p[1]}/${p[0]}`;
    }
    const parts = displayDt.split('/');
    const mIdx  = parts.length===3 ? parseInt(parts[1])-1 : mesIdx;
    // Categoriza
    const dl = desc.toLowerCase();
    let cat = catFromFornecedor(desc);
    if(!cat){
      if(dl.includes('aplicacao')||dl.includes('resgate')||APLIC_PATTERNS.some(p=>dl.includes(p))) cat='Aplicação Financeira';
      else if(PIX_PATTERNS.some(p=>dl.includes(p))) cat='Pix Interna';
      else if(dl.includes('debito automatico')||dl.includes('pagamento efetuado')) cat='Despesas Fixas';
      else if(dl.includes('debito titulo')||dl.includes('boleto')) cat='Despesas Fixas';
      else if(dl.includes('compra no debito')) cat=categorizeDebito(dl);
      else if(dl.includes('pix enviado')) cat='';
      // sem categoria — usuário decide na pré-visualização
    }
    return mkTxn(displayDt, desc, val, type, cat, 'Banco Inter', mIdx);
  }).filter(Boolean);
}

function parsePagSeguro(wb, mesIdx){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const raw=XLSX.utils.sheet_to_json(ws,{header:1});
  // Header está na linha 8 (índice 8): Data, _, Tipo, _, Descrição, Entradas, Saidas, Saldo
  // Saídas são valores NEGATIVOS na coluna Saidas (índice 6)
  // Entradas são valores positivos na coluna Entradas (índice 5) — ignoradas por política
  const SAIDA_TIPOS = ['pagamento de conta','pix enviado','qr code pix enviado','transferência enviada','transferencia enviada','debito'];
  return raw.slice(9).map(r=>{
    const rawDt  = r[0];
    const tipo   = String(r[2]||'').trim().toLowerCase();
    const desc   = String(r[4]||'').trim();
    const saiRaw = parseFloat(String(r[6]||'').replace(',','.'));
    if(!desc || desc==='Descrição' || desc==='Descricao') return null;
    // Só processa saídas (valores negativos na coluna Saidas)
    if(isNaN(saiRaw) || saiRaw >= 0) return null;
    const val = Math.abs(saiRaw);
    if(val === 0) return null;
    // Data: formato DD/MM/YYYY string
    let displayDt = `01/${pad(mesIdx+1)}/${currentYear}`;
    if(rawDt && typeof rawDt === 'string' && rawDt.includes('/')) displayDt = rawDt.slice(0,10);
    else if(rawDt instanceof Date) displayDt = `${pad(rawDt.getDate())}/${pad(rawDt.getMonth()+1)}/${rawDt.getFullYear()}`;
    // Mês real da transação
    const parts = displayDt.split('/');
    const mIdx = parts.length===3 ? parseInt(parts[1])-1 : mesIdx;
    // Categoriza pela descrição (fornecedores) ou tipo
    let cat = catFromFornecedor(desc);
    if(!cat){
      if(tipo.includes('pagamento de conta')) cat='Despesas Fixas';
      // sem categoria — usuário decide na pré-visualização
    }
    return mkTxn(displayDt, desc, val, 'saida', cat, 'PagSeguro', mIdx);
  }).filter(Boolean);
}

function categorizeDebito(dl){
  if(dl.includes('posto')||dl.includes('combus')) return 'Despesas Variáveis';
  return ESTOQUE_CAT;
}

// Busca categoria pelo nome do fornecedor cadastrado
function catFromFornecedor(desc){
  const dl = desc.toLowerCase();
  // Primeiro tenta fornecedores cadastrados (ordem de cadastro)
  for(const f of fornecedores){
    if(dl.includes(f.nome.toLowerCase())) return f.cat;
  }
  // Depois tenta customMap (aprendizado de importações anteriores)
  if(customMap[dl]) return customMap[dl];
  return null;
}

function mkTxn(date,desc,value,type,category,source,month,year){
  return {id:nextId(),date:cleanDate(date),desc,value:Math.round(value*100)/100,type,category:normCat(category,desc),source,month,year:year||currentYear};
}
function pad(n){return String(n).padStart(2,'0')}
function dtToDisplay(isoDate){
  const p=isoDate.split('-');
  return `${p[2]}/${p[1]}/${p[0]}`;
}
// Corrige datas corrompidas por um bug antigo que gravava "undefined/undefined/DD/MM/AAAA"
// no banco (ex: dtToDisplay rodando em cima de uma data que já estava em DD/MM/AAAA).
// Se a string já terminar em DD/MM/AAAA válido, usa só essa parte; senão devolve como veio.
function cleanDate(d){
  if(!d) return d;
  const s=String(d);
  const m=s.match(/(\d{2}\/\d{2}\/\d{4})$/);
  return m ? m[1] : s;
}

// ═══════════════════════════════════════════════════════════════════
// MIGRAÇÃO ÚNICA: backup Excel (aba "Lançamentos") → Supabase
// ═══════════════════════════════════════════════════════════════════
function migrateBackupToSupabase(file){
  if(!file) return;
  if(!confirm('Importar todos os lançamentos desse backup para o banco agora?')) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets['Lançamentos'];
      if(!ws){ showToast('Aba "Lançamentos" não encontrada nesse arquivo.', true); return; }
      const rows = XLSX.utils.sheet_to_json(ws);
      if(!rows.length){ showToast('Nenhum lançamento encontrado no arquivo.', true); return; }

      const parsed = rows.map(r => {
        const mesIdx = MESES_FULL.indexOf(r['Mês']);
        return mkTxn(
          String(r['Data']||''),
          String(r['Descrição']||''),
          parseFloat(r['Valor'])||0,
          r['Tipo']==='Entrada' ? 'entrada' : 'saida',
          (r['Categoria']&&r['Categoria']!=='(sem categoria)') ? r['Categoria'] : '',
          r['Origem']||'',
          mesIdx>=0 ? mesIdx : 0,
          parseInt(r['Ano'])||currentYear
        );
      });

      showToast(`Enviando ${parsed.length} lançamentos ao banco...`, false, true);

      // Envia em lotes para não estourar o tamanho de uma única requisição
      const CHUNK = 400;
      let sent = 0, failed = false;
      for(let i=0; i<parsed.length; i+=CHUNK){
        const batch = parsed.slice(i, i+CHUNK);
        const ok = await gasWrite(batch);
        if(!ok){ failed = true; break; }
        sent += batch.length;
      }

      if(failed){
        showToast(`Enviados ${sent} de ${parsed.length} — ocorreu um erro, tente novamente para completar.`, true);
      }else{
        showToast(`✓ Migração concluída — ${sent} lançamentos no banco!`);
      }
      await syncFromGas(true);
    }catch(err){
      console.error('migrateBackupToSupabase error:', err);
      showToast('Erro ao importar o backup: '+err.message, true);
    }
  };
  reader.readAsArrayBuffer(file);
}

// FILE IMPORT HANDLER
// ═══════════════════════════════════════════════════════════════════
function handleFileInput(file){
  if(!file) return;
  const src=document.getElementById('imp-src').value;
  const mesIdx=parseInt(document.getElementById('imp-month').value);
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      let txns;
      if(src==='consumer') txns=parseConsumer(wb,mesIdx);
      else if(src==='webquadras') txns=parseWebQuadras(wb,mesIdx);
      else if(src==='inter') txns=parseInter(wb,mesIdx);
      else if(src==='pagseguro') txns=parsePagSeguro(wb,mesIdx);
      if(!txns||txns.length===0){showToast('Nenhum lançamento detectado.',true);return;}

      // Month mismatch warning
      const mismatch = checkMonthMismatch(txns, mesIdx);
      if(mismatch){
        const pctOk = 100 - mismatch.pct;
        showToast(`⚠ ${mismatch.pct}% dos lançamentos são de outro mês: ${mismatch.months}. O sistema usou as datas reais da planilha.`, false, true);
      }
      // Mapeia id da fonte para o mesmo string usado nos parsers
      const srcLabelMap = {consumer:'Consumer', webquadras:'WebQuadras', inter:'Banco Inter', pagseguro:'PagSeguro'};
      const srcLabel = srcLabelMap[src] || src;
      const months=[...new Set(txns.map(t=>t.month))];

      // Duplicata por fonte + mês
      const existingBySource = allTxns.filter(t=>t.source===srcLabel && months.includes(t.month) && (t.year===currentYear||!t.year));

      // Duplicata exata: mesmo valor + mesma data + mesma descrição (independente de fonte)
      const exactDups = txns.filter(newT =>
        allTxns.some(ex =>
          ex.value === newT.value &&
          ex.date === newT.date &&
          ex.desc === newT.desc
        )
      );

      if(existingBySource.length > 0 || exactDups.length > 0){
        let msg = '';
        if(existingBySource.length > 0){
          msg += `Já existem <b>${existingBySource.length}</b> lançamentos da fonte <b>${srcLabel}</b> em <b>${months.map(m=>MESES_FULL[m]).join(', ')}/${currentYear}</b>.`;
        }
        if(exactDups.length > 0){
          if(msg) msg += '<br><br>';
          msg += `<b>${exactDups.length}</b> lançamento(s) com mesmo valor, data e descrição já existem na base:<br>`;
          msg += exactDups.slice(0,3).map(t=>`<span style="font-size:14px;color:var(--muted)">• ${t.date} — ${t.desc.slice(0,40)} — ${fmtFull(t.value)}</span>`).join('<br>');
          if(exactDups.length>3) msg += `<br><span style="font-size:14px;color:var(--muted)">...e mais ${exactDups.length-3}</span>`;
        }
        msg += '<br><br>Importar novamente pode gerar dados duplicados. O que deseja fazer?';
        document.getElementById('dupMsg').innerHTML = msg;
        dupCallback.onContinue=()=>{pendingTxns=txns;pendingEditCats={};pendingReplace=null;closeDupModal();renderMain();showToast(`${txns.length} lançamentos detectados. Revise e confirme.`,'',true);};
        dupCallback.onReplace=()=>{
          // Não apaga nada ainda: guarda quais serão substituídos e só remove (na tela E no banco) ao Confirmar.
          const old=allTxns.filter(t=>t.source===srcLabel&&months.includes(t.month)&&(t.year===currentYear||!t.year));
          pendingReplace={ids:old.map(t=>String(t.id)), label:`${srcLabel} em ${months.map(m=>MESES_FULL[m]).join(', ')}/${currentYear}`};
          pendingTxns=txns;pendingEditCats={};closeDupModal();renderMain();
          showToast(`${old.length} lançamentos anteriores serão substituídos ao confirmar. Revise os ${txns.length} novos.`,'',true);
        };
        document.getElementById('dupContinueBtn').onclick=dupCallback.onContinue;
        document.getElementById('dupReplaceBtn').onclick=dupCallback.onReplace;
        document.getElementById('dupModal').classList.add('open');
      } else {
        pendingTxns=txns;pendingEditCats={};pendingReplace=null;renderMain();
        showToast(`${txns.length} lançamentos detectados. Revise e confirme.`,'',true);
      }
    }catch(err){showToast('Erro ao ler arquivo: '+err.message,true);}
  };
  reader.readAsArrayBuffer(file);
}
function closeDupModal(){document.getElementById('dupModal').classList.remove('open');}

async function handleJsonImport(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      const imported = JSON.parse(e.target.result);
      if(!Array.isArray(imported)||imported.length===0){showToast('Arquivo JSON inválido ou vazio.',true);return;}
      const year = imported[0].year;
      const existing = allTxns.filter(t=>t.year===year||t.year===currentYear).length;
      const yearsInFile = [...new Set(imported.map(t=>t.year))].sort();
      let msg = `Este arquivo contém <b>${imported.length}</b> lançamentos de <b>${yearsInFile.join(', ')}</b>.`;
      if(existing>0) msg += `<br><br>Já existem <b>${existing}</b> lançamentos na base para esses anos. Substituir ou somar?`;
      document.getElementById('dupMsg').innerHTML = msg + '<br><br>Selecione como importar:';
      dupCallback.onContinue = async ()=>{
        allTxns = [...allTxns, ...imported];
        lsSave();
        if(GAS_URL) await gasWrite(allTxns);
        closeDupModal(); renderNav(); renderMain();
        showToast(`✓ ${imported.length} lançamentos adicionados (${yearsInFile.join(', ')})!`);
      };
      dupCallback.onReplace = async ()=>{
        allTxns = allTxns.filter(t=>!yearsInFile.includes(t.year));
        allTxns = [...allTxns, ...imported];
        lsSave();
        if(GAS_URL) await gasWrite(allTxns);
        closeDupModal(); renderNav(); renderMain();
        showToast(`✓ ${imported.length} lançamentos importados (${yearsInFile.join(', ')}) — anteriores substituídos!`);
      };
      document.getElementById('dupContinueBtn').textContent = 'Somar aos existentes';
      document.getElementById('dupReplaceBtn').textContent = '🗑 Substituir existentes';
      document.getElementById('dupContinueBtn').onclick = dupCallback.onContinue;
      document.getElementById('dupReplaceBtn').onclick = dupCallback.onReplace;
      document.getElementById('dupModal').classList.add('open');
    }catch(err){showToast('Erro ao ler JSON: '+err.message,true);}
  };
  reader.readAsText(file);
}

async function confirmImport(){
  const snapshot = JSON.stringify(allTxns); // snapshot BEFORE
  const newCustom={...customMap};
  pendingTxns.forEach(t=>{
    const cat=pendingEditCats[t.id]!==undefined?pendingEditCats[t.id]:t.category;
    if(cat) t.category=cat;
    if(cat&&cat!==t.category) newCustom[t.desc.toLowerCase()]=cat;
  });
  const src = pendingTxns[0]?.source || 'Desconhecido';
  const months = [...new Set(pendingTxns.map(t=>MESES_FULL[t.month]))].join(', ');
  const replaced = pendingReplace; pendingReplace = null;
  if(replaced){
    const del=new Set(replaced.ids);
    allTxns=allTxns.filter(t=>!del.has(String(t.id)));
  }
  allTxns=[...allTxns,...pendingTxns];
  customMap=newCustom;
  localStorage.setItem('arenab12_customMap',JSON.stringify(newCustom));
  lsSave();
  addLog('IMPORTAÇÃO', `${pendingTxns.length} lançamentos de ${src} — ${months}/${currentYear}${replaced?` (substituiu ${replaced.ids.length} anteriores)`:''}`, true, snapshot);
  if(replaced && replaced.ids.length && GAS_URL){
    // Apaga do banco os substituídos (antes isso só acontecia na tela e eles voltavam ao recarregar)
    (async()=>{ for(let i=0;i<replaced.ids.length;i+=300) await gasMergeTxns(currentYear,[],replaced.ids.slice(i,i+300)); })();
  }
  if(GAS_URL){
    // Merge: envia só os lançamentos importados (cada um com id único).
    // Não apaga o que outro dispositivo já colocou no mesmo mês.
    const byYear={};
    pendingTxns.forEach(t=>{
      const y=t.year||currentYear;
      if(!byYear[y]) byYear[y]=[];
      byYear[y].push(t);
    });
    Promise.all(Object.entries(byYear).map(([y,list])=>gasMergeTxns(parseInt(y),list)))
      .then(results=>{ if(results.every(Boolean)) showToast('Salvo no banco ✓'); else showToast('Salvo localmente (envio parcial ao banco)',false,true); });
  }
  selMonth=pendingTxns[0]?.month??selMonth;
  pendingTxns=[];pendingEditCats={};
  setTab('dashboard');
  showToast(`✓ ${allTxns.length} lançamentos importados!`);
}

    const txnRows = sorted.map(t=>({

      'Tipo': t.type==='entrada'?'Entrada':'Saída',
      'Categoria': t.category||'(sem categoria)',
      'Origem': t.source||'',
      'Mês': MESES_FULL[t.month]||'',
      'Ano': t.year||''
    }));
    const wsTxns = XLSX.utils.json_to_sheet(txnRows);
    wsTxns['!cols'] = [{wch:12},{wch:40},{wch:12},{wch:9},{wch:32},{wch:14},{wch:12},{wch:7}];
    XLSX.utils.book_append_sheet(wb, wsTxns, 'Lançamentos');

    // Uma aba de DRE por ano presente nos dados, igual à tela "DRE Anual"
    const years = [...new Set(allTxns.map(t=>t.year).filter(Boolean))].sort();
    const rows = dreRowDefs();
    years.forEach(year=>{
      const annSums = MESES_SHORT.map((_,i)=>computeSummary(allTxns.filter(t=>t.month===i && t.year===year)));
      const totalSum = computeSummary(allTxns.filter(t=>t.year===year));
      const aoa = [['CATEGORIA', ...MESES_SHORT, 'TOTAL']];
      rows.forEach(row=>{
        const line = [row.l];
        annSums.forEach(s=>{
          const v = dreGetV(s,row.k);
          line.push(row.pct ? (isNaN(v)?'':Math.round(v*100)+'%') : Math.round((v||0)*100)/100);
        });
        const totalV = dreGetV(totalSum,row.k);
        line.push(row.pct ? (isNaN(totalV)?'':Math.round(totalV*100)+'%') : Math.round((totalV||0)*100)/100);
        aoa.push(line);
      });
      const wsDre = XLSX.utils.aoa_to_sheet(aoa);
      wsDre['!cols'] = [{wch:26}, ...MESES_SHORT.map(()=>({wch:10})), {wch:12}];
      XLSX.utils.book_append_sheet(wb, wsDre, 'DRE '+year);
    });

    // Aba de fornecedores/categorias aprendidas (útil para auditoria do backup)
    if(fornecedores && fornecedores.length){
      const wsForn = XLSX.utils.json_to_sheet(fornecedores.map(f=>({'Fornecedor / Descrição':f.nome,'Categoria':f.cat})));
      wsForn['!cols'] = [{wch:34},{wch:32}];
      XLSX.utils.book_append_sheet(wb, wsForn, 'Fornecedores');
    }

    const hoje = new Date();
    const fname = `ArenaB12_Backup_${hoje.getFullYear()}-${pad(hoje.getMonth()+1)}-${pad(hoje.getDate())}.xlsx`;
    XLSX.writeFile(wb, fname);
    showToast('Backup Excel gerado: '+fname);
  }catch(e){
    console.error('exportExcelBackup error:', e);
    showToast('Erro ao gerar o Excel. Veja o console para detalhes.', true);
  }
}

// --- RELATÓRIO PDF ANUAL (DRE completo do ano, via impressão do navegador) ---
function printAnual(){
  const annSums = MESES_SHORT.map((_,i)=>computeSummary(txnsForMonth(i)));
  const totalSum = computeSummary(allTxns.filter(t=>t.year===currentYear));
  const rows = dreRowDefs();

  // Para RESULTADO e Margem Líquida o sinal importa (podem ser negativos) — como o
  // PDF é em preto e branco, aqui o sinal "-" é sempre exibido (fmtK() normalmente
  // mostra o valor absoluto), além de uma cor sutil para reforçar lucro x prejuízo.
  function dispVal(row, v){
    if(row.pct) return fmtPct(v);
    if(v===0) return '—';
    if(row.k==='lucro') return (v>0?'+':'-')+fmtK(v).replace('R$ ','');
    return fmtK(v).replace('R$ ','');
  }
  function cellStyle(row, v){
    if(row.k==='lucro'||row.k==='ml') return v>=0?'color:#0a8a3f':'color:#c62828';
    return '';
  }
  const bodyRows = rows.map(row=>{
    const totalV = dreGetV(totalSum,row.k);
    const cells = annSums.map(s=>{
      const v = dreGetV(s,row.k);
      return `<td class="num" style="${cellStyle(row,v)}">${dispVal(row,v)}</td>`;
    }).join('');
    return `<tr class="${row.sec?'sec':''}"><td>${row.l}</td>${cells}<td class="num" style="${cellStyle(row,totalV)}">${dispVal(row,totalV)}</td></tr>`;
  }).join('');

  document.getElementById('printArea').innerHTML = `
    <div class="pr-header">
      <img src="${logoDataUrl()}" alt="Arena B12"/>
      <div class="pr-titles">
        <h1>DRE — Resultado Anual</h1>
        <span class="pr-sub">Ano de ${currentYear} (valores em R$)</span>
      </div>
      <div class="pr-meta">Gerado em ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>
    <table class="pr-table">
      <thead><tr><th>Categoria</th>${MESES_SHORT.map(m=>`<th class="num">${m}</th>`).join('')}<th class="num">Total</th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
    <div class="pr-footer">Arena B12 — Relatório gerado automaticamente pelo Dashboard Financeiro</div>
  `;
  window.print();
}

  const t=allTxns.find(x=>x.id===id);

  openConfirm(`Excluir lançamento?`,`Excluir "${t.desc}" (${t.type==='entrada'?'+':'-'}${fmtFull(t.value)})? Esta ação não pode ser desfeita.`,()=>{
    const snapshot = JSON.stringify(allTxns);
    allTxns=allTxns.filter(x=>x.id!==id);
    lsSave(); if(GAS_URL) gasMergeTxns(currentYear, [], [id]);
    addLog('EXCLUSÃO', `"${t.desc}" ${t.type==='entrada'?'+':'-'}${fmtFull(t.value)} — ${MESES_FULL[t.month]}/${currentYear}`, true, snapshot);

function clearMonthConfirm(){
  const cnt=txnsForMonth(selMonth).length;
  if(cnt===0){showToast(`Nenhum lançamento em ${MESES_FULL[selMonth]}.`,false,true);return;}
  openConfirm(`Excluir todos os lançamentos de ${MESES_FULL[selMonth]}/${currentYear}?`,
    `Esta ação irá apagar permanentemente os ${cnt} lançamentos de ${MESES_FULL[selMonth]}/${currentYear}. Esta ação não pode ser desfeita.`,
    ()=>{
      const snapshot = JSON.stringify(allTxns);
      allTxns=allTxns.filter(t=>!(t.month===selMonth && t.year===currentYear));
      lsSave();
      if(GAS_URL) gasWriteMonths(currentYear, {[selMonth]: []});
      addLog('LIMPEZA', `${cnt} lançamentos de ${MESES_FULL[selMonth]}/${currentYear} removidos`, true, snapshot);
      renderNav();renderMain();showToast(`${MESES_FULL[selMonth]} limpo (${cnt} lançamentos removidos).`);
    });
}

function clearSourceMonth(src){
  const list=txnsForMonth(selMonth).filter(t=>(t.source||'—')===src);
  if(list.length===0) return;
  openConfirm(`Excluir lançamentos de ${src} em ${MESES_FULL[selMonth]}/${currentYear}?`,
    `Esta ação irá apagar ${list.length} lançamentos da fonte "${src}" em ${MESES_FULL[selMonth]}/${currentYear}. Outras fontes não serão afetadas.`,
    ()=>{
      const snapshot = JSON.stringify(allTxns);
      const ids=list.map(t=>t.id);
      allTxns=allTxns.filter(t=>!ids.includes(t.id));
      lsSave();
      if(GAS_URL) gasMergeTxns(currentYear, [], ids);
      addLog('LIMPEZA', `${list.length} lançamentos de ${src} em ${MESES_FULL[selMonth]}/${currentYear} removidos`, true, snapshot);
      renderNav();renderMain();showToast(`${list.length} lançamentos de ${src} removidos.`);
    });
}

let fornecedores = [];

function loadFornecedores(){
  try{
    const saved = localStorage.getItem('arenab12_fornecedores');
    if(saved){
      fornecedores = JSON.parse(saved);
      // Converte fornecedores cadastrados com as categorias antigas de estoque
      if(fornecedores.some(f=>normCat(f.cat)!==f.cat)){
        fornecedores.forEach(f=>{ f.cat = normCat(f.cat); });
        saveFornecedores();
      }
    }
    else { seedFornecedores(); }
  }catch(e){ seedFornecedores(); }
}

function seedFornecedores(){
  fornecedores = FORNECEDORES_SEED.map((f,i)=>({id:'seed_'+i, nome:f.nome, cat:normCat(f.cat)}));

}

  localStorage.setItem('arenab12_fornecedores', JSON.stringify(fornecedores));

  fornecedores.forEach(f=>{ newMap[f.nome.toLowerCase()] = f.cat; });
  customMap = newMap;
  localStorage.setItem('arenab12_customMap', JSON.stringify(newMap));
}

function addFornecedor(){
  const nome = document.getElementById('fn-nome').value.trim().toUpperCase();
  const cat  = document.getElementById('fn-cat').value;
  if(!nome || !cat){ showToast('Preencha o nome e a categoria.',true); return; }
  if(fornecedores.some(f=>f.nome===nome)){ showToast('Fornecedor já cadastrado.',false,true); return; }
  fornecedores.push({id:'f_'+Date.now(), nome, cat});
  saveFornecedores();
  document.getElementById('fn-nome').value='';
  document.getElementById('fn-cat').value='';
  renderMain();
  showToast(`"${nome}" adicionado com categoria "${cat}".`);
}

  const newCat = document.getElementById('forn-edit-cat').value;
  f.cat = newCat;

function deleteFornecedor(id){
  const f = fornecedores.find(x=>x.id===id);

  openConfirm(`Remover "${f.nome}"?`, `O fornecedor será removido e não categorizará mais automaticamente em novas importações.`, ()=>{

    renderMain();
    showToast(`"${f.nome}" removido.`);

// LOGS & UNDO

let logs = [];
let undoStack = []; // [{snapshot, log}]

function loadLogs(){
  try{ logs=JSON.parse(localStorage.getItem('arenab12_logs')||'[]'); }catch(e){ logs=[]; }
}
function saveLogs(){
  // Keep last 200 logs
  if(logs.length>200) logs=logs.slice(-200);
  localStorage.setItem('arenab12_logs', JSON.stringify(logs));
}

function addLog(action, detail, undoable=false, snapshotBefore=null){
  const entry = {
    id: nextId(),
    ts: new Date().toISOString(),
    action,
    detail,
    undoable,
    undone: false,
  };
  logs.push(entry);
  saveLogs();

  if(undoable && snapshotBefore !== null){
    undoStack.push({ logId: entry.id, snapshot: snapshotBefore });
    // Keep undo stack max 20 deep
    if(undoStack.length > 20) undoStack.shift();
  }

  // Update logs tab badge if visible
  const nb = document.getElementById('nb-logs');
  if(nb) nb.setAttribute('data-count', logs.length);
}

// ═══════════════════════════════════════════════════════════════════
// DUPLICADOS DE IMPORTAÇÃO
// Regra conservadora: só mexe num bloco (mês + origem) quando ele inteiro está repetido
// o mesmo nº de vezes (ex.: todos os lançamentos da Consumer de janeiro aparecem 2x).
// Lançamentos iguais "soltos" num bloco normal (ex.: dois mensalistas com mesmo valor
// no mesmo dia) não são tocados.
// ═══════════════════════════════════════════════════════════════════
function findImportDuplicates(year){
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  const blocks={};
  allTxns.filter(t=>t.year===year).forEach(t=>{
    const bk=t.month+'|'+(t.source||'');
    const key=[t.date,t.desc,Math.round((t.value||0)*100),t.type].join('|');
    ((blocks[bk]=blocks[bk]||{})[key]=blocks[bk][key]||[]).push(t);
  });
  const extras=[], summary=[];
  Object.entries(blocks).forEach(([bk,groups])=>{
    const lists=Object.values(groups);
    const g=lists.reduce((acc,l)=>gcd(acc,l.length),0);
    if(g<2) return;
    let removed=0;
    lists.forEach(l=>{
      // mantém primeiro os que têm categoria, depois os mais antigos (id menor)
      const sorted=[...l].sort((a,b)=>(!!b.category-!!a.category)||String(a.id).localeCompare(String(b.id)));
      const keep=l.length/g;
      sorted.slice(keep).forEach(t=>{extras.push(t);removed++;});
    });
    const [m,src]=bk.split('|');
    summary.push({month:+m,source:src,removed,times:g});
  });
  summary.sort((a,b)=>a.month-b.month||a.source.localeCompare(b.source));
  return {extras,summary};
}

function reviewDuplicates(){
  const {extras,summary}=findImportDuplicates(currentYear);
  if(extras.length===0){ showToast('Nenhuma importação duplicada encontrada em '+currentYear+'.'); return; }
  const lines=summary.map(s=>`• ${MESES_FULL[s.month]} — ${s.source||'(sem origem)'}: ${s.removed} cópias (importado ${s.times}x)`).join('\n');
  openConfirm(
    `Remover ${extras.length} lançamentos duplicados de ${currentYear}?`,
    `Estes blocos foram importados mais de uma vez; fica 1 cópia de cada lançamento:\n\n${lines}\n\nDá para desfazer pela aba Logs.`,
    async ()=>{
      const snapshot=JSON.stringify(allTxns);
      const ids=new Set(extras.map(t=>String(t.id)));
      allTxns=allTxns.filter(t=>!ids.has(String(t.id)));
      lsSave();
      addLog('DUPLICADOS', `${extras.length} lançamentos duplicados removidos (${currentYear})`, true, snapshot);
      const idList=[...ids];
      let ok=true;
      for(let i=0;i<idList.length&&ok;i+=300) ok=await gasMergeTxns(currentYear,[],idList.slice(i,i+300));
      showToast(ok?`✓ ${extras.length} duplicados removidos`:'Removido neste dispositivo, mas o envio ao banco falhou — tente Sync.', !ok);
      renderNav(); renderMain();
    }
  );
}

function undoLast(){
  if(undoStack.length===0){ showToast('Nenhuma ação para desfazer.',false,true); return; }
  const {logId, snapshot} = undoStack.pop();
  const logEntry = logs.find(l=>l.id===logId);
  allTxns = JSON.parse(snapshot);
  lsSave();
  if(GAS_URL) gasWrite(allTxns);
  if(logEntry) logEntry.undone = true;
  saveLogs();
  renderNav(); renderMain();
  showToast('Ação desfeita com sucesso. ↩');
}

function undoSpecific(logId){
  const idx = undoStack.findIndex(u=>u.logId===logId);
  if(idx<0){ showToast('Esta ação não pode mais ser desfeita (muito antiga ou já desfeita).',false,true); return; }
  openConfirm(
    'Desfazer esta ação?',
    'Os dados serão restaurados para o estado anterior a esta ação. Ações mais recentes TAMBÉM serão desfeitas.',
    ()=>{
      // Undo everything from this point forward
      const {snapshot} = undoStack[idx];
      undoStack.splice(idx); // remove this and all newer
      const logEntry = logs.find(l=>l.id===logId);
      allTxns = JSON.parse(snapshot);
      // Mark all subsequent undoable logs as undone
      let found=false;
      logs.forEach(l=>{ if(l.id===logId){found=true;} if(found&&l.undoable) l.undone=true; });
      lsSave(); saveLogs();
      if(GAS_URL) gasWrite(allTxns);
      renderNav(); renderMain();
      showToast('Ação desfeita. ↩');
    }
  );
}

function renderLogs(){
  const reversed = [...logs].reverse();
  const canUndo = undoStack.length > 0;

  const typeColors = {
    'IMPORTAÇÃO':   'badge-green',
    'EXCLUSÃO':     'badge-red',
    'EDIÇÃO':       'badge-blue',
    'MANUAL':       'badge-orange',

    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

  return `<div class="tab-content">

        HISTÓRICO DE AÇÕES — ${logs.length} registros
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${canUndo ? `<button class="btn-primary" onclick="undoLast()" style="background:var(--blue)">
          ↩ Desfazer última ação
        </button>` : `<button class="btn-outline" disabled style="opacity:.3;cursor:default">↩ Nada para desfazer</button>`}
        ${logs.length>0?`<button class="btn-outline" style="border-color:rgba(255,68,68,.3);color:var(--red);font-size:10px" onclick="clearLogs()">✕ Limpar logs</button>`:''}
      </div>
    </div>

    ${logs.length===0?`<div style="text-align:center;padding:40px;color:var(--muted);font-size:11px;letter-spacing:1.5px">NENHUMA AÇÃO REGISTRADA AINDA</div>`:`
    <div class="tbl-wrap" style="max-height:520px">
      <table>
        <thead><tr>
          <th style="min-width:130px">DATA / HORA</th>
          <th style="min-width:100px">AÇÃO</th>
          <th>DETALHE</th>
          <th style="width:100px">STATUS</th>
          <th style="width:80px"></th>
        </tr></thead>
        <tbody>
          ${reversed.map(l=>{
            const badge = typeColors[l.action]||'badge-gray';
            const undoIdx = undoStack.findIndex(u=>u.logId===l.id);
            const canUndoThis = undoIdx>=0 && !l.undone;
            return `<tr style="${l.undone?'opacity:.45':''}">
              <td style="white-space:nowrap;color:var(--muted);font-family:var(--f-body)">${fmtTs(l.ts)}</td>
              <td><span class="badge ${badge}">${l.action}</span></td>
              <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px" title="${l.detail}">${l.detail}</td>
              <td>${l.undone
                ? `<span style="font-size:14px;color:var(--muted)">↩ Desfeito</span>`
                : l.undoable
                  ? `<span style="font-size:10px;color:var(--green)">● Ativo</span>`
                  : `<span style="font-size:12px;color:var(--muted2)">— —</span>`
              }</td>
              <td>${canUndoThis
                ? `<button class="btn-icon edit" onclick="undoSpecific('${l.id}')" title="Desfazer esta ação" style="color:var(--blue)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
                  </button>`
                : ''
              }</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`}
  </div>
  </div>`;
}

function clearLogs(){
  openConfirm('Limpar histórico de logs?','Todos os registros de ações serão apagados. O histórico de desfazer também será limpo.',()=>{
    logs=[]; undoStack=[];
    localStorage.removeItem('arenab12_logs');
    renderMain();
    showToast('Logs limpos.');
  });
}

// ═══════════════════════════════════════════════════════════════════
// MONTH MISMATCH DETECTION
// ═══════════════════════════════════════════════════════════════════

function checkMonthMismatch(txns, mesIdx){
  // Count how many transactions have a different month than selected
  const mismatch = txns.filter(t => t.month !== mesIdx);
  if(mismatch.length === 0) return null;

  const byMonth = {};
  mismatch.forEach(t=>{ byMonth[t.month]=(byMonth[t.month]||0)+1; });
  const monthNames = Object.entries(byMonth)
    .sort((a,b)=>b[1]-a[1])
    .map(([m,n])=>`${MESES_FULL[m]} (${n})`)
    .join(', ');

  return {
    total: mismatch.length,
    pct: Math.round(mismatch.length/txns.length*100),
    months: monthNames,
  };
}

// INIT
// ═══════════════════════════════════════════════════════════════════
// Repara categorias neutras que estavam em despesas (Pix Interna, Aplicação Financeira) — usado no b12Start() abaixo
const PIX_PATTERNS = ['arena b12','gr becker','becker eventos','gustavo becker','08561701','pix interna'];
const APLIC_PATTERNS = ['aplicacao','aplicação','resgate','firf','cdb','tesouro'];

async function b12Start(){
  await loadTxnsFromSupabase();

  const beforePurge = allTxns.length;
  allTxns = allTxns.filter(t => t.year >= 2025);
  if(allTxns.length !== beforePurge){ lsSave(); }

  // Repara lançamentos sem year (bug anterior)
  let _repaired = 0;
  allTxns = allTxns.map(t => {
    if(t.year === undefined || t.year === null) {
      const parts = (t.date||'').split('/');
      const inferredYear = parts.length===3 ? parseInt(parts[2]) : 2026;
      _repaired++;
      return {...t, year: isNaN(inferredYear) ? 2026 : inferredYear};
    }
    return t;
  });
  let _fixedCat = 0;
  allTxns = allTxns.map(t => {
    const dl = (t.desc||'').toLowerCase();
    if(t.category === 'Despesas Variáveis' || t.category === 'Outras Receitas') {
      if(PIX_PATTERNS.some(p => dl.includes(p))) {
        _fixedCat++;
        return {...t, category:'Pix Interna'};
      }
      if(APLIC_PATTERNS.some(p => dl.includes(p))) {
        _fixedCat++;
        return {...t, category:'Aplicação Financeira'};
      }
    }
    return t;
  });
  if(_repaired > 0 || _fixedCat > 0){ lsSave(); }
  loadLogs();
  loadFornecedores();
  selMonth=new Date().getMonth();
  setTab('dashboard');
  addLog('SISTEMA', `Dashboard iniciado — ${new Date().toLocaleDateString('pt-BR')}`, false);
}
// Só sócios usam o Financeiro. Se o login for de outro perfil (ex.: escola), volta para a Área da Arena.
// Se a função de perfis ainda não existir no Supabase, segue normalmente.
const b12StartDashboard = b12Start;
window.b12Start = async function(){
  try {
    const { data, error } = await supa.rpc('meu_papel');
    if (!error && data && data !== 'socio') { location.href = '../'; return; }
  } catch(e) {}
  b12StartDashboard();
};

// Se já existe uma sessão válida (login anterior), pula a tela de login direto
(async function(){
  const { data: { session } } = await supa.auth.getSession();
  if(session){
    const el = document.getElementById('b12LoginScreen');
    if(el) el.style.display='none';
    window.b12Start();
  }
})();
