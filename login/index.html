<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Área da Arena · Arena B12</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Arena B12"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" href="../assets/favicon.png"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
@font-face{font-family:'Monument Extended';src:url('../assets/fonts/MonumentExtended-Regular.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Monument Extended';src:url('../assets/fonts/MonumentExtended-Ultrabold.otf') format('opentype');font-weight:800;font-display:swap}
@font-face{font-family:'Monument Extended';src:url('../assets/fonts/MonumentExtended-Black.otf') format('opentype');font-weight:900;font-display:swap}
/* Hub da Área da Arena: uma coluna central, cartões por sistema; mesmo visual escuro do site e do Financeiro */
:root{
  --bg:#0a0a0a;--surf:#121110;--surf2:#1a1816;--line:#262320;--fg:#f4f0ea;--muted:#9c948a;
  --orange:#FF620B;--orange-soft:rgba(255,98,11,.10);--red:#ff5b4f;--green:#3ecf7a;
  --f-display:'Monument Extended','Arial Black',system-ui,sans-serif;
  --f-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body{padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
a{color:inherit}
.wrap{max-width:880px;margin:0 auto;padding-block:28px 48px}

/* Login */
.loginwrap{min-height:calc(100vh - 40px);display:grid;place-items:center}
.card{width:100%;max-width:380px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:grid;gap:14px}
.card img{height:22px;width:auto;justify-self:center}
.sub{font-family:var(--f-display);font-size:11px;letter-spacing:.22em;color:var(--muted);text-align:center;margin-top:-4px}
.lbl{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
.in:focus{border-color:var(--orange);outline:none}
.f{display:grid;gap:6px}
.btn{border:0;border-radius:10px;padding:13px 18px;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.08em;cursor:pointer;background:var(--orange);color:#140a03}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:11px;padding:9px 14px}
.btn.ghost:hover{color:var(--fg);border-color:var(--muted)}
.err{color:var(--red);font-size:13px;min-height:18px;text-align:center}
.back{font-size:13px;color:var(--muted);text-align:center;text-decoration:none}
.back:hover{color:var(--fg)}

/* Hub */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.top img{height:20px;width:auto;display:block}
.top .who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,5.4vw,34px);letter-spacing:.01em;margin:28px 0 6px;text-transform:uppercase;line-height:1.05}
.lead{color:var(--muted);margin:0 0 22px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sys{position:relative;display:grid;gap:10px;align-content:start;text-decoration:none;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:190px;transition:border-color .15s,transform .15s}
.sys:hover{border-color:var(--orange);transform:translateY(-2px)}
.sys .ic{width:42px;height:42px;border-radius:12px;background:var(--orange-soft);display:grid;place-items:center}
.sys .ic svg{width:22px;height:22px;stroke:var(--orange);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sys h2{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.04em;margin:0;text-transform:uppercase}
.sys p{margin:0;color:var(--muted);font-size:13.5px}
.sys .go{margin-top:auto;font-family:var(--f-display);font-size:11px;letter-spacing:.12em;color:var(--orange)}
.tag{position:absolute;top:16px;right:16px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:3px 9px;background:var(--surf2);color:var(--muted);border:1px solid var(--line)}
.tag.test{color:var(--orange);border-color:rgba(255,98,11,.4);background:var(--orange-soft)}
.note{margin-top:22px;font-size:12.5px;color:var(--muted)}
.empty{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:24px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sys{transition:none}.sys:hover{transform:none}}
</style>
</head>
<body>

<div id="loginView" class="loginwrap" hidden>
  <form class="card" id="loginForm" novalidate>
    <img src="../assets/logo-horizontal.png" alt="Arena B12"/>
    <div class="sub">ÁREA DA ARENA</div>
    <label class="f"><span class="lbl">E-MAIL</span><input class="in" type="email" id="email" autocomplete="username" placeholder="seu@email.com"/></label>
    <label class="f"><span class="lbl">SENHA</span><input class="in" type="password" id="pass" autocomplete="current-password" placeholder="••••••••"/></label>
    <button class="btn" id="btnIn" type="submit">ENTRAR →</button>
    <div class="err" id="err" role="alert"></div>
    <a href="../" class="back">← Voltar ao site</a>
  </form>
</div>

<div id="hubView" class="wrap" hidden>
  <header class="top">
    <a href="../" aria-label="Ir para o site"><img src="../assets/logo-horizontal.png" alt="Arena B12"/></a>
    <div class="who"><span id="who"></span><button class="btn ghost" id="btnOut" type="button">SAIR</button></div>
  </header>
  <h1>Área da Arena</h1>
  <p class="lead" id="lead">Escolha o sistema.</p>
  <div class="grid" id="cards"></div>
  <p class="note">Mesmo login para todos os sistemas. Cada pessoa vê só o que tem permissão.</p>
</div>

<script>
const supa = window.supabase.createClient(
  'https://zryazxwxrufzeyaoeqbm.supabase.co',
  'sb_publishable_Hux6NxPxXSMnb1gW5gDXzA_j5ja3bhN'
);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICON = {
  fin:'<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>',
  gq:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  esc:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l3 2-1 4h-4l-1-4z"/><path d="M12 3v4M21 12h-4M3 12h4M12 21v-4"/></svg>'
};
/* papel → sistemas visíveis */
const SYSTEMS = [
  {id:'fin', href:'financeiro/', title:'Financeiro', text:'Receitas, despesas, DRE anual e importação dos extratos.', roles:['socio']},
  {id:'gq', href:'quadras/', title:'Gestão de quadras', text:'Agenda, mensalistas, clientes, eventos e recebimentos. As reservas reais continuam no WebQuadras.', roles:['socio','caixa','recepcao'], tag:'Teste'},
  {id:'esc', href:'escola/', title:'Escola de futebol', text:'Meninos da Vila · alunos, mensalidades e repasse para a Arena.', roles:['socio','escola'], tag:'Em construção'}
];
const ROLE_NAME = {socio:'Sócio', caixa:'Caixa', recepcao:'Caixa', escola:'Escola de futebol'};

async function showHub(session){
  $('#loginView').hidden = true; $('#hubView').hidden = false;
  let papel = null, nome = session.user.email, semPerfis = false;
  try {
    const { data, error } = await supa.from('perfis').select('nome,papel').eq('user_id', session.user.id).maybeSingle();
    if (error) semPerfis = true; else if (data) { papel = data.papel; if (data.nome && !data.nome.includes('@')) nome = data.nome; }
  } catch(e) { semPerfis = true; }
  // Antes de rodar o script de perfis no Supabase, todo login existente é de sócio.
  if (semPerfis) papel = 'socio';
  $('#who').textContent = papel ? `${nome} · ${ROLE_NAME[papel] || papel}` : nome;
  const list = SYSTEMS.filter(s => papel && s.roles.includes(papel));
  if (!list.length) {
    $('#lead').textContent = '';
    $('#cards').innerHTML = `<div class="empty">Seu acesso ainda não foi liberado. Fale com a Arena B12 para definirem o seu perfil.</div>`;
    return;
  }
  if (list.length === 1 && papel !== 'socio') { location.replace(list[0].href); return; }
  $('#lead').textContent = 'Escolha o sistema.';
  $('#cards').innerHTML = list.map(s => `<a class="sys" href="${s.href}">${s.tag ? `<span class="tag${s.tag==='Teste'?' test':''}">${esc(s.tag)}</span>` : ''}
    <span class="ic" aria-hidden="true">${ICON[s.id]}</span><h2>${esc(s.title)}</h2><p>${esc(s.text)}</p><span class="go">ABRIR →</span></a>`).join('');
}
function showLogin(){ $('#hubView').hidden = true; $('#loginView').hidden = false; setTimeout(() => $('#email').focus(), 50); }

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#email').value.trim(), pass = $('#pass').value, btn = $('#btnIn'), err = $('#err');
  if (!email || !pass) { err.textContent = 'Preencha e-mail e senha.'; return; }
  btn.disabled = true; btn.textContent = 'ENTRANDO...';
  const { data, error } = await supa.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = 'ENTRAR →';
  if (error) { err.textContent = 'E-mail ou senha incorretos.'; $('#pass').value = ''; $('#pass').focus(); return; }
  err.textContent = ''; $('#pass').value = '';
  showHub(data.session);
});
$('#btnOut').addEventListener('click', async () => { await supa.auth.signOut(); showLogin(); });

(async () => {
  const { data: { session } } = await supa.auth.getSession();
  session ? showHub(session) : showLogin();
})();

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
