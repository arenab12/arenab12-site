<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/favicon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Gestão de quadras · Arena B12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — barra superior com marca + abas; cada aba é uma tela de trabalho (grade de agenda, listas, painel financeiro). */
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --surface-2:#ECE8E2; --line:#DDD7CE;
  --fg:#1C1A17; --muted:#6C655B; --accent:#FF620B; --accent-ink:#FFFFFF; --accent-soft:#FFE7D8;
  --ok:#1E844A; --ok-soft:#DCF1E3; --warn:#A86300; --warn-soft:#FBEED3; --bad:#BF3328; --bad-soft:#F9E0DD;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131211; --surface:#1C1A18; --surface-2:#262320; --line:#35312C;
  --fg:#F1EDE7; --muted:#A49C91; --accent:#FF7A30; --accent-ink:#1A0E06; --accent-soft:#3B2517;
  --ok:#4CC27E; --ok-soft:#163122; --warn:#E8A43A; --warn-soft:#33270F; --bad:#F0675A; --bad-soft:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131211; --surface:#1C1A18; --surface-2:#262320; --line:#35312C;
  --fg:#F1EDE7; --muted:#A49C91; --accent:#FF7A30; --accent-ink:#1A0E06; --accent-soft:#3B2517;
  --ok:#4CC27E; --ok-soft:#163122; --warn:#E8A43A; --warn-soft:#33270F; --bad:#F0675A; --bad-soft:#3A1A17; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-stretch:125%;font-weight:800;letter-spacing:.02em;font-size:18px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand{align-items:center}
.logo{display:block;line-height:0}
.logo img{height:20px;width:auto;display:block}
.lg-d{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-l{display:none!important}:root:not([data-theme="light"]) .lg-d{display:block!important}}
:root[data-theme="dark"] .lg-l{display:none!important}
:root[data-theme="dark"] .lg-d{display:block!important}
.brand small{font-stretch:100%;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button:hover{background:var(--surface-2);color:var(--fg)}
nav.tabs button[aria-current="true"]{background:var(--fg);color:var(--bg)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px}
.sync.on::before{background:var(--ok)}
.sync.off::before{background:var(--bad)}

main{padding-block:20px 48px;display:grid;gap:20px}
h1{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.04em}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ex{background:var(--surface-2);color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{padding:14px 16px;display:grid;gap:4px}
.stat .v{font-family:var(--f-display);font-stretch:115%;font-weight:700;font-size:24px;line-height:1.1}
.stat .s{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* Agenda */
.datenav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datenav .day{font-family:var(--f-display);font-stretch:115%;font-weight:700;font-size:17px;text-transform:capitalize;min-width:0}
input[type=date],input[type=month],input[type=text],input[type=tel],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{resize:vertical;min-height:60px;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.grid th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.grid th.h,.grid td.h{width:64px;position:sticky;left:0;background:var(--surface);z-index:2}
.grid td.h{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding:0 8px;vertical-align:top;padding-top:10px;border-right:1px solid var(--line)}
.grid td.h.night{color:var(--fg)}
.grid td{border-bottom:1px solid var(--line);padding:3px;height:54px;vertical-align:top}
.grid tr:last-child td{border-bottom:0}
.grid tr.now td.h{color:var(--accent);font-weight:600}
.slot{width:100%;height:100%;min-height:46px;border-radius:7px;border:1px dashed transparent;background:transparent;cursor:pointer;text-align:left;padding:5px 8px;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden}
.slot.free{color:var(--muted);font-size:12px}
.slot.free:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.slot.free .p{opacity:0}
.slot.free:hover .p{opacity:1}
.slot.past.free{cursor:default}
.slot.past.free:hover{border-color:transparent;background:transparent;color:var(--muted)}
.slot.bk{border:0;border-left:4px solid var(--c);background:var(--cs)}
.slot.bk .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.slot.bk .m{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.paid{--c:var(--ok);--cs:var(--ok-soft)}
.slot.pend{--c:var(--warn);--cs:var(--warn-soft)}
.slot.mens{--c:var(--accent);--cs:var(--accent-soft)}
.slot.blk{--c:var(--muted);--cs:var(--surface-2)}

/* Listas */
.list{width:100%;border-collapse:collapse}
.list th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tr:last-child td{border-bottom:0}
.list tr.click{cursor:pointer}
.list tr.click:hover td{background:var(--surface-2)}
.list .num{text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cols > *{min-width:0}
.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* Gráfico */
.chart{padding:12px 16px 16px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}

/* Modal */
.ov{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mb{padding:16px 18px;display:grid;gap:14px}
.mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{display:grid;gap:5px;min-width:0}
.f > input,.f > select{width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:480px){.g3{grid-template-columns:1fr 1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:7px 8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.err{color:var(--bad);font-size:13px}
.rules{display:grid;gap:10px}
.rule{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.rule .days{display:flex;gap:4px;flex-wrap:wrap}
.rule .days button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 0;width:44px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.rule .days button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.rule .rr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule .rr input{width:96px}
.ptab{overflow-x:auto}
.ptab table{border-collapse:collapse;width:100%;min-width:440px;font-size:12.5px}
.ptab th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 4px;font-weight:600}
.ptab td{padding:5px 4px;text-align:center;border-top:1px solid var(--line);font-family:var(--f-mono)}
.ptab td.h{color:var(--muted);text-align:left}
.ptab td.none{color:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.banner{padding:12px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-weight:500}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}

/* Alternância Gestão / Site do cliente */
.mode{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:0 0 auto}
.mode button{border:0;background:transparent;padding:7px 12px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
body.client nav.tabs{visibility:hidden}
@media (max-width:640px){body.client nav.tabs{display:none}}

/* Visão do cliente */
.cv{max-width:560px;width:100%;margin:0 auto;display:grid;gap:20px;padding-bottom:110px}
.cv .note-proto{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:9px;padding:8px 12px}
.cv h1{font-size:clamp(24px,6.4vw,30px);font-weight:900;line-height:1.05}
.cv .steps{display:flex;gap:6px}
.cv .steps span{flex:1;display:grid;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.cv .steps span::before{content:"";height:4px;border-radius:2px;background:var(--surface-2)}
.cv .steps span.on{color:var(--fg)}
.cv .steps span.on::before,.cv .steps span.done::before{background:var(--accent)}
.cv .dates{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.cv .dchip{flex:0 0 auto;width:58px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;cursor:pointer;display:grid;justify-items:center;gap:1px}
.cv .dchip small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.cv .dchip b{font-family:var(--f-display);font-stretch:115%;font-size:20px;font-weight:800;line-height:1.1}
.cv .dchip em{font-style:normal;font-size:10.5px;color:var(--muted)}
.cv .dchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cv .dchip[aria-pressed="true"] small,.cv .dchip[aria-pressed="true"] em{color:var(--accent-ink)}
.cv .period{display:grid;gap:8px}
.cv .hrow{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.cv .ht b{display:block;font-family:var(--f-display);font-stretch:112%;font-size:18px;font-weight:800}
.cv .ht small{font-size:12px;color:var(--muted)}
.cv .courts{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;min-width:0}
.cv .cbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 4px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .cbtn:hover:not(:disabled){border-color:var(--accent)}
.cv .cbtn:disabled{background:transparent;color:var(--muted);opacity:.5;text-decoration:line-through;cursor:not-allowed;border-style:dashed}
.cv .cbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cv .hrow.full{opacity:.55}
.cv .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.cv .big{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:18px;text-transform:uppercase}
.cv .f input,.cv .f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
.cv .f input[aria-invalid="true"]{border-color:var(--bad)}
.cv .msg{font-size:12.5px;color:var(--bad)}
.cv .hint{font-size:12.5px;color:var(--ok)}
.cv .chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.cv .chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:0 0 auto}
.cv .lgpd{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:12px;line-height:1.5}
.cv .okmark{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:26px;font-weight:900}
.cv .code{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:26px;letter-spacing:.04em;color:var(--accent)}
.cv .kv dd{text-align:right}
.cv .note{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:13.5px}
.cv .bigbtn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-family:var(--f-display);font-stretch:112%;text-transform:uppercase;letter-spacing:.03em;padding:13px 20px;border-radius:11px;cursor:pointer;white-space:nowrap}
.cv .bigbtn.sec{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.cv .link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.selbar .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
.selbar .sum{flex:1;min-width:0;display:grid}
.selbar .sum b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* E-mail simulado (cores fixas de e-mail, iguais nos dois temas) */
.mail{width:100%;max-width:560px;border-radius:14px;overflow:hidden;background:#FFFFFF;color:#1C1A17;box-shadow:0 20px 60px rgba(0,0,0,.4);align-self:flex-start}
.mail .cl{background:#EEF0F3;color:#4A4F57;padding:10px 14px;font-size:12.5px;display:grid;gap:2px;border-bottom:1px solid #D9DCE1;position:relative}
.mail .cl .x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:18px;cursor:pointer;color:#4A4F57}
.mail .mhd{background:#0E0D0C;padding:18px 20px}
.mail .mhd img{height:18px;display:block}
.mail .mbd{padding:22px 20px;display:grid;gap:14px;font-size:14.5px}
.mail h4{margin:0;font-size:20px;font-family:var(--f-display);font-stretch:112%;font-weight:800}
.mail table{width:100%;border-collapse:collapse;font-size:14px}
.mail td{padding:8px 0;border-bottom:1px solid #ECE8E2}
.mail td+td{text-align:right;font-weight:600}
.mail .mbtn{display:inline-block;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer;border:0;font-size:14px}
.mail .mbtn.o{background:#FF620B;color:#FFFFFF}
.mail .mbtn.g{background:#FFFFFF;color:#BF3328;border:1.5px solid #E3C3BF}
.mail .mft{padding:14px 20px;background:#F6F4F1;color:#7A746B;font-size:12px}
.mail .tag{display:inline-block;background:#FFE7D8;color:#B5470A;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}
.mail.page{background:var(--surface);color:var(--fg)}

table.grid{table-layout:fixed}
.slot.na{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px);border-radius:7px;cursor:default}
.slot .t{font-family:var(--f-mono);font-size:11.5px}
.slot.free .t{color:var(--muted)}
.grid th small{display:block;font-family:var(--f-body);font-stretch:100%;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.courts-ed{display:grid;gap:8px;overflow-x:auto}
.ce-h,.ce{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(110px,1fr) 120px 120px 90px;gap:8px;align-items:center;min-width:600px}
.ce input,.ce select{width:100%}
.rgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.chips{display:flex;gap:4px;flex-wrap:wrap}

function findClient({cpf, phone, clientId} = {}){
  if (clientId) { const c = S.clientsReg.find(x => x.id === clientId); if (c) return c; }
  const d = digits(cpf); if (docOk(d)) { const c = S.clientsReg.find(x => digits(x.cpf) === d); if (c) return c; }
  const ph = digits(phone).slice(-11);
  if (ph.length >= 10) { const c = S.clientsReg.find(x => digits(x.phone).slice(-11) === ph && (!docOk(d) || !docOk(x.cpf))); if (c) return c; }
  return null;
}

}
async function upsertClient({name, cpf, phone, email}, opt = {}){

function clients(){
  const map = new Map();
  const hidden = {key:"__del", hist:[], mens:[], visits:0, total:0, pending:0, noShows:0};
  for (const r of S.clientsReg) if (!r.deleted) map.set(r.id, {key:r.id, reg:true, name:r.name, phone:r.phone||"", cpf:r.cpf||"", email:r.email||"", blocked:!!r.blocked, blockReason:r.blockReason||"", blockedAt:r.blockedAt||"", noShows:0, visits:0, total:0, pending:0, last:"", mens:[], hist:[]});
  const get = (x) => {
    const reg = clientOf(x); if (reg && reg.deleted) return hidden;
    const k = reg ? reg.id : clientKey(x.clientName, x.phone);
    if (!map.has(k)) map.set(k, {key:k, reg:false, name:x.clientName, phone:x.phone||"", cpf:"", email:"", blocked:false, noShows:0, visits:0, total:0, pending:0, last:"", mens:[], hist:[]});
    const c = map.get(k);
    if (!c.cpf && x.cpf) c.cpf = x.cpf; if (!c.email && x.email) c.email = x.email; if (!c.phone && x.phone) c.phone = x.phone;
    return c;
  };
  for (const b of activeBk()) { if (b.kind === "bloqueio") continue; const c = get(b); if (b.noShow) c.noShows++; c.visits++; c.total += Number(b.price)||0; if (!b.paid) c.pending += Number(b.price)||0; if (b.date > c.last && b.date <= today()) c.last = b.date; c.hist.push(b); }

}

/* Recebimentos pela data da baixa (regime de caixa) */
function receipts(month){
  const out = [];
  for (const b of S.bookings) {
    if (!b.paid || b.status === "cancelado" || b.kind === "bloqueio") continue;
    const pd = payDay(b); if (monthOf(pd) !== month) continue;
    const ev = b.kind === "evento";
    out.push({src:"bk", id:b.id, kind: ev ? "Evento" : "Avulso", eventType:b.eventType||"", dur:Number(b.dur)||1, pay:pd, method:b.method, pays:paysOf(b, b.price), value:Number(b.price)||0, ref:b.date, refLabel: ev ? `Evento${b.eventType?` (${b.eventType})`:""} ${brDate(b.date)} ${tm(minOf(b))}` : `Jogo ${brDate(b.date)} ${tm(minOf(b))}`, court:b.court, min:minOf(b),
      ...(c => ({name:c?.name || b.clientName, cpf:c?.cpf || b.cpf || "", email:c?.email || b.email || "", phone:c?.phone || b.phone || ""}))(clientOf(b)), code:b.code||"", notes:b.notes||"", origem:b.origem==="site"?"Site":"Gestão"});
  }
  for (const r of S.recurring) for (const [comp, p] of Object.entries(r.payments || {})) {
    if (!p) continue; const pd = String(p.at || comp + "-01").slice(0,10); if (monthOf(pd) !== month) continue;
    out.push({src:"rec", id:r.id, comp, kind:"Mensalidade", pay:pd, method:p.method, pays:paysOf(p, p.value ?? r.monthly), value:Number(p.value ?? r.monthly)||0, ref:comp + "-01", refLabel:`Mensalidade ${monthLabel(comp)}`, court:r.court, min:minOf(r),
      ...(c => ({name:c?.name || r.clientName, cpf:c?.cpf || r.cpf || "", email:c?.email || r.email || "", phone:c?.phone || r.phone || ""}))(clientOf(r)), code:"", notes:r.notes||"", origem:"Gestão", weekday:r.weekday});
  }
  return out.sort((a,b) => a.pay.localeCompare(b.pay) || String(a.name).localeCompare(String(b.name)));
}

/* Mensalidades sem baixa: vencida depois do dia de vencimento do próprio mês */
function recDues(upTo){
  const out = [], dd = pad(S.cfg.dueDay), t = today();
  for (const r of S.recurring) {
    let comp = monthOf(r.startDate || r.createdAt || t);
    const end = r.endDate ? monthOf(r.endDate) : null;
    while (comp <= upTo) {
      if (end && comp > end) break;
      if (!(r.payments && r.payments[comp]) && recOccurrences(r, comp) > 0) {
        const due = `${comp}-${dd}`;
        out.push({r, comp, due, overdue: due < t, value:Number(r.monthly)||0});
      }
      const [y,m] = comp.split("-").map(Number); comp = m === 12 ? `${y+1}-01` : `${y}-${pad(m+1)}`;
    }
  }
  return out.sort((a,b) => a.due.localeCompare(b.due) || String(a.r.clientName).localeCompare(String(b.r.clientName)));
}

function ask({title, text = "", ok = "Confirmar", cancel = "Voltar", danger = true}){
  return new Promise(resolve => {
    let root = document.getElementById("askRoot");
    if (!root) { root = document.createElement("div"); root.id = "askRoot"; document.body.appendChild(root); }
    const prevFocus = document.activeElement;
    root.innerHTML = `<div class="askov" id="askOv"><div class="askbox" role="alertdialog" aria-modal="true" aria-labelledby="askT" aria-describedby="askD">
      <div class="askic${danger?" d":""}" aria-hidden="true">!</div>
      <h2 id="askT">${esc(title)}</h2>${text ? `<p id="askD">${text}</p>` : ""}
      <div class="askbtns"><button type="button" class="btn" id="askNo">${esc(cancel)}</button><button type="button" class="btn ${danger?"dangerbtn":"pri"}" id="askYes">${esc(ok)}</button></div></div></div>`;
    const done = v => { root.innerHTML = ""; document.removeEventListener("keydown", key, true); try { prevFocus && prevFocus.focus(); } catch(_){} resolve(v); };
    const key = e => { if (e.key === "Escape") { e.stopPropagation(); e.preventDefault(); done(false); } };
    document.addEventListener("keydown", key, true);
    root.querySelector("#askNo").addEventListener("click", () => done(false));
    root.querySelector("#askYes").addEventListener("click", () => done(true));
    root.querySelector("#askOv").addEventListener("mousedown", e => { if (e.target.id === "askOv") done(false); });
    root.querySelector("#askNo").focus();
  });
}

function splitHTML(pays){
  const rows = (pays && pays.length ? pays : [{m:"pix", v:0}]);
  const row = (p, i) => `<div class="sprow"><select data-sm aria-label="Forma ${i+1}">${PAY_METHS.map(k => `<option value="${k}"${k===p.m?" selected":""}>${METH[k]}</option>`).join("")}</select><input type="number" data-sv min="0" step="5" value="${Number(p.v)||0}" aria-label="Valor da forma ${i+1}">${i ? '<button type="button" class="btn sm ghost danger" data-sx aria-label="Remover forma">✕</button>' : ""}</div>`;
  return `<div class="split" id="split">${rows.map(row).join("")}<div class="row"><button type="button" class="btn sm ghost" id="spAdd">+ Dividir em outra forma</button><span class="spacer"></span><span class="spmsg" id="spMsg"></span></div></div>`;
}
function bindSplit(root, totalSel){
  const box = $("#split", root), tot = () => Number($(totalSel, root).value) || 0;
  const rows = () => [...box.querySelectorAll(".sprow")];
  const sync = () => {
    const rs = rows(); rs.forEach((r, i) => r.querySelector("[data-sv]").hidden = rs.length === 1);
    if (rs.length === 1) rs[0].querySelector("[data-sv]").value = tot();
    const sum = rs.reduce((t, r) => t + (Number(r.querySelector("[data-sv]").value) || 0), 0), diff = Math.round((tot() - sum) * 100) / 100;
    const msg = $("#spMsg", root); msg.className = "spmsg" + (rs.length > 1 && diff ? " bad" : "");
    msg.textContent = rs.length === 1 ? "" : diff > 0 ? `Falta ${brl(diff)}` : diff < 0 ? `Passou ${brl(-diff)}` : "Soma confere";
  };
  box.addEventListener("input", sync); $(totalSel, root).addEventListener("input", sync);
  box.addEventListener("click", e => {
    if (e.target.closest("#spAdd")) { const rs = rows(), sum = rs.reduce((t, r) => t + (Number(r.querySelector("[data-sv]").value) || 0), 0);
      const used = rs.map(r => r.querySelector("[data-sm]").value), m = PAY_METHS.find(k => !used.includes(k)) || "dinheiro";
      const tmp = document.createElement("div"); tmp.innerHTML = splitHTML([{m:"pix",v:0},{m, v:Math.max(0, tot() - sum)}]); const nr = tmp.querySelectorAll(".sprow")[1];
      e.target.closest(".row").before(nr); sync(); nr.querySelector("[data-sv]").focus(); }
    const x = e.target.closest("[data-sx]"); if (x) { x.closest(".sprow").remove(); sync(); }
  });
  sync();
  return {
    read: () => { const ps = rows().map(r => ({m:r.querySelector("[data-sm]").value, v:Number(r.querySelector("[data-sv]").value) || 0})).filter(p => p.v > 0 || rows().length === 1);
      const merged = []; ps.forEach(p => { const e = merged.find(x => x.m === p.m); e ? e.v += p.v : merged.push({...p}); }); return merged; },
    check: () => { const ps = rows(); if (ps.length === 1) return ""; const sum = ps.reduce((t, r) => t + (Number(r.querySelector("[data-sv]").value) || 0), 0);
      return Math.abs(sum - tot()) > 0.009 ? `A soma das formas (${brl(sum)}) precisa ser igual ao valor (${brl(tot())}).` : ""; }
  };
}
const methodOf = pays => pays.length > 1 ? "misto" : (pays[0] || {}).m || "pix";

function render(){
  if (isCaixa() && !CAIXA_VIEWS.includes(S.view)) S.view = "agenda";

  const openN = S.notes.filter(n => n.status !== "resolvida").length, nb = document.getElementById("nbNotes");
  if (nb) { nb.hidden = !openN || isCaixa(); nb.textContent = openN; }
  const rs = document.getElementById("roleSel"); if (rs) rs.value = S.role;
  const app = $("#app");
  const ready = S.loaded.cfg && S.loaded.bk && S.loaded.rc;
  if (S.noAccess) { app.innerHTML = `<div class="banner">Seu login não tem acesso à gestão de quadras. <a href="../">Voltar à Área da Arena</a></div>`; return; }
  if (!S.db) { app.innerHTML = `<div class="banner">Não foi possível conectar ao banco de dados. Confira a internet e recarregue a página.</div>`; return; }

  app.innerHTML = ro + (views[S.view] || vAgenda)();

}

const agModeSeg = () => `<div class="seg agseg" role="group" aria-label="Visão da agenda"><button type="button" data-agm="dia" aria-pressed="${S.agMode!=="semana"}">Dia</button><button type="button" data-agm="semana" aria-pressed="${S.agMode==="semana"}">Semana</button></div>`;
const courtShort = c => { const w = String(c.name).trim().split(/\s+/); const num = (String(c.name).match(/\d+/)||[""])[0]; return (w[0][0] || "Q").toUpperCase() + num; };
const weekStart = d => addDays(d, -((parse(d).getDay() + 6) % 7));
function vSemana(){
  const ws = weekStart(S.date), days = Array.from({length:7}, (_,i) => addDays(ws, i));
  const cs = S.cfg.courts.filter(c => !S.wkCourt || c.id === S.wkCourt), one = cs.length === 1;
  const st = {}; days.forEach(d => st[d] = {occ:0, tot:0});
  let rev = 0, nEv = 0;
  activeBk().filter(b => b.date >= ws && b.date <= days[6] && b.kind !== "bloqueio" && (!S.wkCourt || b.court === S.wkCourt || b.court === "all")).forEach(b => { rev += Number(b.price)||0; if (b.kind === "evento") nEv++; });
  const rows = buckets().map(h => `<tr><td class="h">${pad(h)}h</td>${days.map(d => {
    const chips = cs.map(c => {
      const m = slotInBucket(c, h); if (m == null) return "";
      st[d].tot++;
      const s = slotAt(d, m, c.id);
      let cls, ref, label, tip;
      if (s && s.type === "bk") { const b = s.b; st[d].occ++;
        cls = b.kind === "bloqueio" ? "blk" : b.kind === "evento" ? "evt" : b.paid ? "paid" : "pend"; ref = `bk|${b.id}`;
        label = one ? esc(b.clientName || "Bloqueio") : courtShort(c); tip = `${c.name} ${tm(m)} · ${b.clientName || "Bloqueado"}${b.kind==="evento"?` · ${b.eventType||"evento"}`:""}`; }
      else if (s) { const r = s.r; st[d].occ++; cls = "mens"; ref = `rec|${r.id}|${d}`; label = one ? esc(r.clientName) : courtShort(c); tip = `${c.name} ${tm(m)} · ${r.clientName} (mensalista)`; }
      else { const p = priceOf(c.id, d, m), past = isPastSlot(d, m);
        cls = past ? "past" : p == null ? "closed" : "free"; ref = past ? "" : `new|${c.id}|${m}|${d}`;
        label = one ? (past ? "—" : p == null ? "Fechado" : brl(p)) : courtShort(c); tip = `${c.name} ${tm(m)} · ${past ? "passou" : p == null ? "fechado no site" : "livre · " + brl(p)}`; }
      return `<button type="button" class="wk st-${cls}" ${ref ? `data-wk="${ref}"` : "disabled"} title="${esc(tip)}" aria-label="${esc(tip)}">${one ? `<span class="wt">${tm(m)}</span>` : ""}<span>${label}</span></button>`;
    }).join("");
    return `<td class="${d === today() ? "today" : ""}"><div class="wkcell${one ? " one" : ""}">${chips}</div></td>`;
  }).join("")}</tr>`).join("");
  const tOcc = days.reduce((t,d) => t + st[d].occ, 0), tTot = days.reduce((t,d) => t + st[d].tot, 0);
  const fmtWk = `${short(ws)} a ${short(days[6])}`;
  return `
  <section class="row" style="justify-content:space-between">
    <div class="datenav">${agModeSeg()}
      <button class="btn sm" id="prev" aria-label="Semana anterior">‹</button>
      <button class="btn sm" id="tod">Hoje</button>
      <button class="btn sm" id="next" aria-label="Próxima semana">›</button>
      <input type="date" id="dpick" value="${S.date}" aria-label="Escolher data">
      <span class="day">Semana de ${fmtWk}</span>
    </div>
    <div class="row"><select id="wkCourt" aria-label="Quadra"><option value="">Todas as quadras</option>${S.cfg.courts.map(c => `<option value="${esc(c.id)}"${c.id===S.wkCourt?" selected":""}>${esc(courtLabel(c.id))}</option>`).join("")}</select>
      <button class="btn pri" id="newbk">Nova reserva</button></div>
  </section>
  <section class="stats">
    <div class="panel stat"><span class="lbl">Ocupação da semana</span><span class="v">${tOcc}/${tTot}</span><div class="bar"><i style="width:${tTot?Math.round(tOcc/tTot*100):0}%"></i></div><span class="s">${tTot?Math.round(tOcc/tTot*100):0}% dos horários</span></div>
    <div class="panel stat"><span class="lbl">Reservas e eventos da semana</span><span class="v">${brl(rev)}</span><span class="s">${nEv} ${nEv===1?"evento":"eventos"}</span></div>
  </section>
  <div class="legend"><span style="--c:var(--ok)">Pago</span><span style="--c:var(--warn)">Pendente</span><span style="--c:var(--accent)">Mensalista</span><span style="--c:var(--fg)">Evento</span><span style="--c:var(--muted)">Bloqueado</span><span class="lg-free">Livre</span><span class="lg-closed">Fechado</span>${one ? "" : `<span class="muted">${S.cfg.courts.map(c => `${courtShort(c)} = ${esc(c.name)}`).join(" · ")}</span>`}</div>
  <div class="gridwrap"><table class="grid wkgrid" style="min-width:${80 + 7*(one ? 120 : Math.max(110, cs.length*34 + 16))}px"><thead><tr><th class="h"></th>${days.map(d => `<th class="${d===today()?"today":""}"><button type="button" class="wkday" data-wkday="${d}">${WDs[parse(d).getDay()]} ${short(d)}<small>${st[d].occ}/${st[d].tot} ocupados</small></button></th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function vAgenda(){
  if (S.agMode === "semana") return vSemana();
  const d = S.date, cs = S.cfg.courts;
  let occ = 0, rev = 0, pend = 0;
  // Grade em meias horas: cada horário ocupa 2 linhas, então a quadra de horário quebrado começa meia linha abaixo
  const T0 = Math.min(...cs.map(c => c.first)), T1 = Math.max(...cs.map(c => c.last + 60)), nRows = Math.max(0, (T1 - T0) / 30);
  const ROW = 32, place = cs.map(() => new Map()), cover = cs.map(() => new Set());
  cs.forEach((c, ci) => {
    const sl = slotsOf(c);
    for (let k = 0; k < sl.length;) {
      const m = sl[k], s = slotAt(d, m, c.id); let n = 1, html;
      if (s && s.type === "bk") {
        const b = s.b; while (k + n < sl.length) { const nx = slotAt(d, sl[k+n], c.id); if (nx && nx.type === "bk" && nx.b.id === b.id) n++; else break; }
        occ += n;
        const cls = (b.kind === "bloqueio" ? "blk" : (b.paid ? "paid" : "pend")) + (b.kind === "evento" ? " evt" : "");
        const range = `${tm(Math.max(minOf(b), m))}–${tm(Math.min(evEnd(b), m + 60*n))}`;
        const meta = b.kind === "bloqueio" ? `${range} · Bloqueado` : `${range} · ${brl(b.price)} · ${b.paid ? (METH[b.method]||"Pago") : "Pendente"}`;
        const tag = b.kind === "evento" ? ` <span class="pill evt">evento${b.eventType?` · ${esc(b.eventType)}`:""}</span>` : "";
        html = `<button class="slot bk ${cls}" data-bk="${esc(b.id)}"><span class="n">${esc(b.clientName || "—")}${b.nameDiff?' <span class="pill warn">nome ≠ cadastro</span>':""}${b.noShow?' <span class="pill bad">faltou</span>':""}${b.exemplo?' <span class="pill ex">exemplo</span>':""}${b.origem==="site"?' <span class="pill acc">site</span>':""}${tag}</span><span class="m">${meta}</span>${b.notes?`<span class="o">${esc(b.notes)}</span>`:""}</button>`;
      } else if (s) {
        const r = s.r; occ++;
        html = `<button class="slot bk mens" data-rec="${esc(r.id)}"><span class="n">${esc(r.clientName)}${r.exemplo?' <span class="pill ex">exemplo</span>':""}</span><span class="m">${tm(m)}–${tm(m+60)} · Mensalista · ${r.payments && r.payments[monthOf(d)] ? "mês pago" : "mês em aberto"}</span>${r.notes?`<span class="o">${esc(r.notes)}</span>`:""}</button>`;
      } else {
        const past = isPastSlot(d, m), p = priceOf(c.id, d, m);
        html = p == null
          ? `<button class="slot free closed${past?" past":""}" data-new="${esc(c.id)}|${m}" ${past?'tabindex="-1"':""} title="Sem preço na tabela: fechado no site. Clique para reservar manualmente." aria-label="${esc(c.name)} às ${tm(m)}, fechado"><span class="t">${tm(m)}–${tm(m+60)}</span><span class="cl">Fechado</span></button>`
          : `<button class="slot free${past?" past":""}" data-new="${esc(c.id)}|${m}" ${past?'tabindex="-1"':""} aria-label="Reservar ${esc(c.name)} às ${tm(m)}"><span class="t">${tm(m)}–${tm(m+60)}</span><span class="p">+ ${brl(p)}</span></button>`;
      }
      const row = (m - T0) / 30, span = 2*n;
      place[ci].set(row, {span, html}); for (let x = 1; x < span; x++) cover[ci].add(row + x);
      k += n;
    }
  });
  const now = new Date(), nowMin = d === today() ? now.getHours()*60 + now.getMinutes() : -1;
  let rows = "";
  for (let r = 0; r < nRows; r++) {
    const t = T0 + r*30, half = t % 60 !== 0, isNow = nowMin >= t && nowMin < t + 30;
    rows += `<tr class="${half?"hf":"fh"}${isNow?" now":""}"><td class="h">${half ? `<span class="hh">${tm(t)}</span>` : tm(t)}</td>${cs.map((c, ci) => {
      const cell = place[ci].get(r); if (cell) return `<td rowspan="${cell.span}" class="cell"><div class="cw" style="height:${cell.span*ROW - 5}px">${cell.html}</div></td>`;
      if (cover[ci].has(r)) return "";
      return `<td class="gap"></td>`;
    }).join("")}</tr>`;
  }
  const total = totalSlots();
  const dayBk = activeBk().filter(b => b.date === d && b.kind !== "bloqueio");
  dayBk.forEach(b => { rev += Number(b.price)||0; if (!b.paid) pend += Number(b.price)||0; });
  const dayEv = dayBk.filter(b => b.kind === "evento").sort((a,b) => minOf(a) - minOf(b));
  return `
  <section class="row" style="justify-content:space-between">
    <div class="datenav">${agModeSeg()}
      <button class="btn sm" id="prev" aria-label="Dia anterior">‹</button>
      <button class="btn sm" id="tod">Hoje</button>
      <button class="btn sm" id="next" aria-label="Próximo dia">›</button>
      <input type="date" id="dpick" value="${d}" aria-label="Escolher data">
      <span class="day">${esc(dayLabel(d))}</span>
    </div>
    <div class="row">${isCaixa() ? `<button class="btn" id="newNote">Anotar pagamento</button>` : `<button class="btn" id="newrecA">Novo mensalista</button>`}<button class="btn pri" id="newbk">Nova reserva</button></div>
  </section>
  <section class="stats">
    <div class="panel stat"><span class="lbl">Ocupação do dia</span><span class="v">${occ}/${total}</span><div class="bar"><i style="width:${total?Math.round(occ/total*100):0}%"></i></div><span class="s">${total?Math.round(occ/total*100):0}% dos horários</span></div>
    <div class="panel stat"><span class="lbl">Reservas e eventos do dia</span><span class="v">${brl(rev)}</span><span class="s">${pend ? brl(pend) + " a receber" : "Tudo recebido"}</span></div>
    <div class="panel stat"><span class="lbl">Mensalistas hoje</span><span class="v">${S.recurring.filter(r => recOn(r, d)).length}</span><span class="s">horários fixos de ${WD[parse(d).getDay()].toLowerCase()}</span></div>
  </section>
  ${dayEv.length ? `<div class="panel"><div class="ph"><h2>Eventos do dia</h2><span class="pill evt">${dayEv.length}</span></div><div class="evlist">${dayEv.map(evCard).join("")}</div></div>` : ""}
  <div class="legend"><span style="--c:var(--ok)">Pago</span><span style="--c:var(--warn)">Pendente</span><span style="--c:var(--accent)">Mensalista</span><span style="--c:var(--muted)">Bloqueado</span></div>
  <div class="gridwrap"><table class="grid hgrid" style="min-width:${120 + cs.length*150}px"><thead><tr><th class="h"></th>${cs.map(c => `<th>${esc(c.name)}${c.sport?`<small>${esc(c.sport)} · ${c.first%60?"horário quebrado":"horário cheio"}</small>`:""}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function evEnd(b){ return minOf(b) + 60*(Number(b.dur)||1); }
function evCard(b){
  return `<button class="evcard" data-bk="${esc(b.id)}"><div class="row"><b>${esc(b.eventType || "Evento")}</b><span class="spacer"></span>${b.paid?`<span class="pill ok">Pago</span>`:`<span class="pill warn">A receber</span>`}</div>
    <span class="muted">${WDs[parse(b.date).getDay()]} ${short(b.date)} · ${tm(minOf(b))}–${tm(evEnd(b))} · ${esc(courtName(b.court))}</span>
    <span>${esc(b.clientName)}${b.guests?` · ${b.guests} convidados`:""} · <b>${brl(b.price)}</b></span>
    ${(b.items||[]).length ? `<span class="chips ro">${b.items.map(x => `<i>${esc(x)}</i>`).join("")}</span>` : ""}
    ${b.notes ? `<span class="o">${esc(b.notes)}</span>` : ""}</button>`;
}
function evSection(m){
  const evs = activeBk().filter(b => b.kind === "evento" && monthOf(b.date) === m).sort((a,b) => a.date.localeCompare(b.date) || minOf(a) - minOf(b));
  const sum = a => a.reduce((t,b) => t + (Number(b.price)||0), 0), paid = evs.filter(b => b.paid);
  const byType = {}; evs.forEach(b => { const k = b.eventType || "Sem tipo"; (byType[k] = byType[k] || []).push(b); });
  const types = Object.entries(byType).sort((a,b) => sum(b[1]) - sum(a[1])); const maxT = Math.max(1, ...types.map(([,l]) => sum(l)));
  const rows = evs.map(b => `<tr class="click" data-bk="${esc(b.id)}">
    <td>${WDs[parse(b.date).getDay()]} ${short(b.date)}<div class="muted" style="font-size:12px">${tm(minOf(b))}–${tm(evEnd(b))}</div></td>
    <td><b>${esc(b.eventType || "Evento")}</b><div class="muted" style="font-size:12px">${esc(courtName(b.court))}${b.guests?` · ${b.guests} convidados`:""}</div></td>
    <td>${esc(b.clientName)}${(b.items||[]).length?`<div class="muted" style="font-size:12px">${b.items.map(esc).join(", ")}</div>`:""}${b.notes?`<div class="o">${esc(b.notes)}</div>`:""}</td>
    <td class="num">${brl(b.price)}</td><td>${b.paid?`<span class="pill ok">Pago ${short(payDay(b))}</span>`:'<span class="pill warn">A receber</span>'}</td></tr>`).join("");
  return `<div class="panel"><div class="ph"><h2>Eventos de ${esc(monthLabel(m))}</h2><span class="pill evt">${evs.length}</span><span class="spacer"></span>
      <span class="muted" style="font-size:12.5px">${brl(sum(evs))} contratados · ${brl(sum(paid))} recebidos</span>
      <button class="btn sm" id="xlsEv" ${evs.length?"":"disabled"}>Exportar eventos</button><button class="btn sm pri" id="newev">Novo evento</button></div>
    ${evs.length ? `<div class="evgrid"><div class="mb">${types.map(([k,l]) => `<div class="f"><div class="row"><span>${esc(k)} <span class="muted">· ${l.length}</span></span><span class="spacer"></span><b>${brl(sum(l))}</b></div><div class="bar"><i style="width:${sum(l)/maxT*100}%"></i></div></div>`).join("")}</div>
      <div class="tblwrap"><table class="list"><thead><tr><th>Data</th><th>Evento</th><th>Cliente e detalhes</th><th class="num">Valor</th><th>Pagamento</th></tr></thead><tbody>${rows}</tbody></table></div></div>` : '<div class="empty">Nenhum evento neste mês (contado pela data do evento).</div>'}</div>`;
}
async function exportEventos(){
  const m = S.month, evs = activeBk().filter(b => b.kind === "evento" && monthOf(b.date) === m).sort((a,b) => a.date.localeCompare(b.date) || minOf(a) - minOf(b));
  if (!evs.length) return;
  if (typeof XLSX === "undefined") { toast("A biblioteca do Excel não carregou. Verifique a internet e recarregue a página."); return; }
  if (!S.dl) { toast("Exportação indisponível neste navegador."); return; }
  const rows = evs.map(b => ({"DATA":brDate(b.date), "INÍCIO":tm(minOf(b)), "FIM":tm(evEnd(b)), "TIPO DE EVENTO":UP(b.eventType||"EVENTO"), "ESPAÇO":UP(courtName(b.court)),
    "CLIENTE":UP(b.clientName), "CPF":fmtCpf(b.cpf)||"", "TELEFONE":fmtPhone(b.phone), "E-MAIL":String(b.email||"").toLowerCase(), "CONVIDADOS":Number(b.guests)||"",
    "INCLUI":UP((b.items||[]).join(", ")), "VALOR":Number(b.price)||0, "PAGAMENTO":b.paid?"PAGO":"A RECEBER", "DATA DO PAGAMENTO":b.paid?brDate(payDay(b)):"", "FORMA":b.paid?UP(payLabel(paysOf(b, b.price))):"", "OBSERVAÇÕES":b.notes||""}));
  const ws = XLSX.utils.json_to_sheet(rows); ws["!cols"] = [11,7,7,26,20,30,15,16,28,11,36,10,11,13,10,50].map(w => ({wch:w}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Eventos");
  try { await S.dl.save({filename:`arena-b12-eventos-${m}.xlsx`, data:new Blob([XLSX.write(wb, {bookType:"xlsx", type:"array"})])}); toast("Planilha de eventos salva."); }

      const title = {evento:`Evento agendado${b.eventType?` · ${esc(b.eventType)}`:""}`, bloqueio:"Horário bloqueado", site:"Reserva feita pelo cliente no site", gestao:"Reserva feita na gestão"}[k];
      it.push({at:b.createdAt, k, title: title + (b.nameDiff ? ' <span class="pill warn">nome ≠ cadastro</span>' : ""), text:`${who} · ${where} · ${when(b)}`, value:k === "bloqueio" ? null : b.price, ref:"bk:"+b.id, teste:b.teste || b.exemplo});

    if (b.paid && b.kind !== "bloqueio") it.push({at:b.paidRegAt || payDay(b) + "T12:00:00", dayOnly:!b.paidRegAt, k:"pag", title:`Pagamento recebido · ${esc(payLabel(paysOf(b, b.price)))}`, text:`${who} · referente a ${b.kind === "evento" ? "evento" : "jogo"} de ${when(b)}${b.paidRegAt && payDay(b) !== b.paidRegAt.slice(0,10) ? ` · pagamento registrado com data ${brDate(payDay(b))}` : ""}`, value:b.price, ref:"bk:"+b.id, teste:b.teste || b.exemplo});
  }
  for (const r of S.recurring) {

    if (r.createdAt) it.push({at:r.createdAt, k:"cadastro", title:"Novo mensalista", text:`${who} · ${slot}`, value:r.monthly, ref:"rec:"+r.id, teste:r.exemplo});

  }
  for (const n of S.notes) {
    it.push({at:n.createdAt, k:"nota", title:`Pagamento anotado${n.by === "caixa" ? " pelo caixa" : ""}${n.value ? ` · ${esc(payLabel(n.pays || []))}` : ""}`, text:`${esc(n.ref ? refLabelOf(n.ref) : "Sem reserva vinculada")}${n.text ? ` · ${esc(n.text)}` : ""}`, value:n.value || null, ref:"nota:" + n.id});
    if (n.status === "resolvida" && n.resolvedAt) it.push({at:n.resolvedAt, k:"nota", title:n.resolvedHow === "baixa" ? "Anotação resolvida com pagamento registrado" : "Anotação marcada como resolvida", text:esc(n.ref ? refLabelOf(n.ref) : n.text || ""), value:null, ref:"nota:" + n.id});
  }
  for (const c of S.clientsReg) {
    if (c.blocked && c.blockedAt) it.push({at:c.blockedAt, k:"cadastro", title:"Cliente colocado na lista de bloqueio", text:`${esc(c.name)}${c.blockReason?` · ${esc(c.blockReason)}`:""}`, value:null, ref:"cli:"+c.id});
    if (c.deleted && c.deletedAt) it.push({at:c.deletedAt, k:"cadastro", title:"Cliente excluído", text:esc(c.name), value:null, ref:"x:"});
  }

  return it.sort((a,b) => String(b.at).localeCompare(String(a.at)));

/* Faixas do mesmo tipo que valem para a mesma quadra, no mesmo dia, em horários que se cruzam */
function findOverlaps(rules, type, courtId){
  const list = rules.filter(r => r.type === type && (!courtId || r.courts[0] === courtId)), out = [], allIds = S.cfg.courts.map(c => c.id);
  for (let i=0;i<list.length;i++) for (let j=i+1;j<list.length;j++){
    const a = list[i], b = list[j];
    const ca = a.courts || allIds, cb = b.courts || allIds, cs = ca.filter(x => cb.includes(x));
    const ds = a.days.filter(x => b.days.includes(x));
    const from = Math.max(a.from, b.from), to = Math.min(a.to, b.to);
    if (cs.length && ds.length && from < to) out.push({i, j, a, b, cs, ds, from, to});
  }
  return out;
}
function renderOverlaps(rules){
  const els = [...document.querySelectorAll("#rulesBox [data-rid]")];
  els.forEach((el, k) => { el.querySelector(".rnum").textContent = `Faixa ${k+1}`; el.classList.remove("ovl"); const w = el.querySelector(".rwarn"); w.hidden = true; });
  const ov = findOverlaps(rules, S.priceTab, S.prevCourt);
  ov.forEach(o => [o.i, o.j].forEach(k => { const el = els[k]; if (!el) return; el.classList.add("ovl"); const w = el.querySelector(".rwarn"); w.hidden = false; w.textContent = "Sobreposta"; }));
  const box = document.getElementById("ovlBox"); if (!box) return ov;
  const days = ds => ds.length === 7 ? "todos os dias" : ds.slice().sort().map(d => WDs[d]).join(", ");
  const cts = cs => cs.length === S.cfg.courts.length ? "todas as quadras" : cs.map(x => courtName(x)).join(", ");
  box.hidden = !ov.length;
  box.innerHTML = ov.length ? `<b>Atenção: ${ov.length === 1 ? "há 1 sobreposição" : `há ${ov.length} sobreposições`} de preço.</b><ul>${ov.map(o => `<li>Faixa ${o.i+1} (R$ ${o.a.price}) e Faixa ${o.j+1} (R$ ${o.b.price}) se cruzam em ${days(o.ds)}, das ${tm(o.from)} às ${o.to===1440?"24:00":tm(o.to)}. Nesse trecho vale a Faixa ${o.j+1}.</li>`).join("")}</ul>` : "";
  return ov;
}
function renderPricePrev(){
  const box = document.getElementById("pricePrev"); if (!box) return;
  const rules = readRules(), t = S.priceTab, c = readCourts().find(x => x.id === S.prevCourt) || court(S.prevCourt);
  renderOverlaps(rules);
  let gaps = 0;

  const rows = slotsOf(c).map(m => `<tr><td class="h">${tm(m)}</td>${WDs.map((w,i) => {

  box.innerHTML = (gaps ? `<p class="err" style="margin:0 0 6px">${gaps} horários desta quadra estão fechados (sem faixa de preço). Eles não aparecem no site e ficam como “Fechado” na agenda; na gestão você ainda pode reservar e digitar o valor.</p>` : "") + legend + `<table><thead><tr><th></th>${WDs.map(w => `<th>${w}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
}

  const h = [...c.hist].sort((a,b) => b.date.localeCompare(a.date) || minOf(b)-minOf(a)).slice(0, 40);
  const wa = digits(c.phone);
  openModal(`
    <div class="mh"><h2>Cliente</h2><span class="spacer"></span><button class="btn sm ghost" data-close aria-label="Fechar">✕</button></div>
    <div class="mb">
      <h1 style="font-size:19px">${esc(c.name)}</h1>
      ${c.blocked ? `<div class="blkbanner"><b>Cliente na lista de bloqueio</b>${c.blockedAt?` desde ${brDate(c.blockedAt)}`:""}.${c.blockReason?`<br>Motivo: ${esc(c.blockReason)}`:""}<br><span style="font-size:12.5px">Não consegue reservar pelo site. Na gestão, o sistema avisa antes de reservar.</span></div>` : ""}
      ${!c.blocked && c.noShows >= 2 ? `<div class="namediff"><b>${c.noShows} faltas sem aviso.</b> Se continuar, você pode colocar este cliente na lista de bloqueio.</div>` : ""}
      <dl class="kv"><dt>Faltas</dt><dd>${c.noShows || 0}</dd><dt>CPF</dt><dd>${c.cpf ? esc(fmtCpf(c.cpf)) : '<span style="color:var(--warn)">não informado</span>'}</dd><dt>E-mail</dt><dd>${esc(c.email) || "—"}</dd><dt>WhatsApp</dt><dd>${esc(fmtPhone(c.phone)) || "—"}</dd></dl>
      ${wa ? `<a class="btn sm" style="justify-self:start" href="https://wa.me/55${wa.replace(/^55/,"")}" target="_blank" rel="noopener">Abrir WhatsApp</a>` : ""}
      <div class="g3"><div class="f"><span class="lbl">Reservas</span><b>${c.visits}</b></div><div class="f"><span class="lbl">Total</span><b>${brl(c.total)}</b></div><div class="f"><span class="lbl">A receber</span><b style="color:${c.pending?"var(--warn)":"inherit"}">${brl(c.pending)}</b></div></div>
      ${c.mens.length ? `<div class="f"><span class="lbl">Horários fixos</span>${c.mens.map(r => `<span>${WD[r.weekday]} ${tm(minOf(r))} · ${esc(courtLabel(r.court))} · ${brl(r.monthly)}/mês</span>`).join("")}</div>` : ""}
      <div class="f"><span class="lbl">Histórico</span>${h.length ? `<div class="tblwrap"><table class="list"><tbody>${h.map(b => `<tr class="click" data-hbk="${esc(b.id)}"><td>${short(b.date)} · ${tm(minOf(b))}</td><td>${esc(courtName(b.court))}${b.kind==="evento"?' <span class="pill evt">evento</span>':""}${b.notes?`<div class="muted" style="font-size:12px">${esc(b.notes)}</div>`:""}</td><td class="num">${brl(b.price)}</td><td>${b.paid?`<span class="pill ok">Pago ${short(payDay(b))}</span>`:'<span class="pill warn">Pendente</span>'}</td></tr>`).join("")}</tbody></table></div>` : '<span class="muted">Nenhuma reserva avulsa.</span>'}</div>
    </div>
    <div class="mf mfwrap"><div class="row" style="flex:1 1 100%;gap:8px" ${isCaixa() ? "hidden" : ""}><button class="btn sm ${c.blocked?"":"danger"}" id="cBlock">${c.blocked ? "Tirar da lista de bloqueio" : "Colocar na lista de bloqueio"}</button><button class="btn sm ghost danger" id="cDel">Excluir cliente</button></div><button class="btn" id="cEdit">Editar cadastro</button>${isCaixa() ? "" : `<button class="btn" id="cMens">Tornar mensalista</button>`}<span class="spacer"></span><button class="btn pri" id="cNew">Nova reserva para ${esc(String(c.name).split(" ")[0])}</button></div>`, root => {
    root.querySelectorAll("[data-hbk]").forEach(tr => tr.addEventListener("click", () => bookingModal(S.bookings.find(x => x.id === tr.dataset.hbk))));
    $("#cEdit",root).addEventListener("click", () => clientEditModal(c));
    $("#cBlock",root).addEventListener("click", () => c.blocked ? unblockClient(c) : blockModal(c));
    $("#cDel",root).addEventListener("click", () => deleteClient(c));
    $("#cMens",root)?.addEventListener("click", () => { recEditModal(null); $("#rName").value = c.name; $("#rPhone").value = fmtPhone(c.phone); $("#rCpf").value = fmtCpf(c.cpf); $("#rEmail").value = c.email || ""; });
    $("#cNew",root).addEventListener("click", () => { bookingModal(null); $("#bkName").value = c.name; $("#bkPhone").value = fmtPhone(c.phone); $("#bkCpf").value = fmtCpf(c.cpf); $("#bkEmail").value = c.email || ""; });

/* Garante que o cliente tenha ficha no cadastro (clientes antigos podem existir só nas reservas) */
async function ensureReg(c){
  if (c.reg) return c.key;
  const id = await upsertClient({name:c.name, cpf:c.cpf, phone:c.phone, email:c.email});
  for (const b of c.hist) if (!b.clientId) await S.db.doc("bookings/" + b.id).update({clientId:id});
  for (const r of c.mens) if (!r.clientId) await S.db.doc("recurring/" + r.id).update({clientId:id});
  return id;
}
function blockModal(c){
  openModal(`
    <div class="mh"><h2>Lista de bloqueio</h2><span class="spacer"></span><button class="btn sm ghost" data-close aria-label="Fechar">✕</button></div>
    <div class="mb"><p style="margin:0"><b>${esc(c.name)}</b>${c.cpf?` · ${esc(fmtCpf(c.cpf))}`:""}${c.noShows?` · ${c.noShows} ${c.noShows>1?"faltas":"falta"} registradas`:""}</p>
      <p class="muted" style="margin:0;font-size:13px">Cliente bloqueado não consegue reservar pelo site: aparece só uma mensagem pedindo para falar com a Arena, sem dizer que está bloqueado. Na gestão, o sistema avisa antes de qualquer reserva.</p>
      <label class="f"><span class="lbl">Motivo (fica registrado na ficha)</span><textarea id="blkReason" rows="3" placeholder="Ex.: 3 reservas sem aparecer e sem avisar (12/10, 26/10, 02/11)"></textarea></label></div>
    <div class="mf"><span class="spacer"></span><button class="btn ghost" data-close>Voltar</button><button class="btn dangerbtn" id="blkOk">Bloquear cliente</button></div>`, root => {
    $("#blkOk",root).addEventListener("click", async () => {
      const reason = $("#blkReason",root).value.trim();
      const ok = await write(async () => { const id = await ensureReg(c); await S.db.doc("clients/" + id).update({blocked:true, blockReason:reason, blockedAt:new Date().toISOString()}); }, `${c.name} foi para a lista de bloqueio.`);
      if (ok) closeModal();
    });
  });
}
async function unblockClient(c){
  if (!await ask({title:`Tirar ${c.name} da lista de bloqueio?`, text:"O cliente volta a poder reservar pelo site normalmente.", ok:"Desbloquear", danger:false})) return;
  if (await write(() => S.db.doc("clients/" + c.key).update({blocked:false, unblockedAt:new Date().toISOString()}), `${c.name} saiu da lista de bloqueio.`)) closeModal();
}
async function deleteClient(c){
  const future = c.hist.filter(b => b.date >= today()).length, act = c.mens.length;
  if (future || act) { await ask({title:"Não dá para excluir agora", text:`${esc(c.name)} tem ${future ? `${future} reserva(s) futura(s)` : ""}${future && act ? " e " : ""}${act ? "mensalidade ativa" : ""}. Cancele ou encerre antes de excluir o cadastro.`, ok:"Entendi", cancel:"Voltar", danger:false}); return; }
  if (!await ask({title:`Excluir ${c.name}?`, text:"O cliente sai da lista de clientes e das buscas. As reservas e pagamentos antigos continuam no Financeiro e na planilha das notas, porque são registros fiscais. Se ele voltar a reservar com o mesmo CPF, o cadastro é reativado.", ok:"Excluir cliente"})) return;
  if (await write(async () => { const id = await ensureReg(c); await S.db.doc("clients/" + id).update({deleted:true, deletedAt:new Date().toISOString()}); }, "Cliente excluído.")) closeModal();
}

function clientEditModal(c){
  openModal(`
    <div class="mh"><h2>Cadastro do cliente</h2><span class="spacer"></span><button class="btn sm ghost" data-close aria-label="Fechar">✕</button></div>
    <form class="mb" id="cef" novalidate autocomplete="off">
      <label class="f"><span class="lbl">Nome completo</span><input type="text" id="ceName" value="${esc(c.name)}" autocomplete="off" data-lpignore="true"></label>
      <div class="g2"><label class="f"><span class="lbl">CPF ou CNPJ</span><input type="text" id="ceDoc" inputmode="numeric" value="${esc(fmtCpf(c.cpf))}" autocomplete="off" data-lpignore="true"></label>
      <label class="f"><span class="lbl">WhatsApp</span><input type="tel" id="cePhone" value="${esc(fmtPhone(c.phone))}" autocomplete="off" data-lpignore="true"></label></div>
      <label class="f"><span class="lbl">E-mail</span><input type="email" id="ceEmail" value="${esc(c.email)}" autocomplete="off" data-lpignore="true"></label>
      <p class="muted" style="margin:0;font-size:12.5px">Os dados corrigidos aqui valem para as próximas reservas e para a planilha das notas, inclusive de recebimentos já feitos.</p>
      <p class="err" id="ceErr" hidden></p>
    </form>
    <div class="mf"><span class="spacer"></span><button class="btn ghost" data-close>Fechar</button><button class="btn pri" id="ceSave">Salvar cadastro</button></div>`, root => {
    $("#ceDoc",root).addEventListener("input", e => e.target.value = maskDoc(e.target.value));
    $("#cef",root).addEventListener("submit", e => { e.preventDefault(); $("#ceSave",root).click(); });
    $("#ceSave",root).addEventListener("click", async () => {
      const err = $("#ceErr",root), name = $("#ceName",root).value.trim(), doc = $("#ceDoc",root).value.trim(), phone = $("#cePhone",root).value.trim(), email = $("#ceEmail",root).value.trim();
      if (!name) { err.textContent = "Informe o nome."; err.hidden = false; return; }
      if (doc && !docOk(doc)) { err.textContent = "O CPF ou CNPJ informado não é válido."; err.hidden = false; return; }
      const other = doc && S.clientsReg.find(x => digits(x.cpf) === digits(doc) && x.id !== c.key);
      if (other) { err.textContent = `Esse documento já está no cadastro de ${other.name}.`; err.hidden = false; return; }
      const ok = await write(async () => {
        if (c.reg) await S.db.doc("clients/" + c.key).update({name, cpf: doc ? fmtCpf(doc) : "", phone, email, updatedAt:new Date().toISOString()});
        else {
          const id = await upsertClient({name, cpf:doc, phone, email});
          for (const b of c.hist) if (!b.clientId) await S.db.doc("bookings/" + b.id).update({clientId:id});
          for (const r of c.mens) if (!r.clientId) await S.db.doc("recurring/" + r.id).update({clientId:id});
        }
      }, "Cadastro salvo.");
      if (ok) closeModal();
    });
  });
}

    <div class="mf"><span class="spacer"></span><button class="btn ghost" data-close>Fechar</button><button class="btn pri" id="pOk">Confirmar recebimento</button></div>`, root => {

/* ---------- Anotações do caixa ---------- */
function noteTargets(){
  const from = addDays(today(), -14), list = [];
  activeBk().filter(b => !b.paid && b.kind !== "bloqueio" && b.date >= from && b.date <= addDays(today(), 1)).sort((a,b) => b.date.localeCompare(a.date) || minOf(b) - minOf(a))
    .forEach(b => list.push({ref:`bk:${b.id}`, label:`${short(b.date)} ${tm(minOf(b))} · ${courtName(b.court)} · ${b.clientName} · ${brl(b.price)}`, value:b.price}));
  const m = monthOf(today());
  S.recurring.filter(r => r.active !== false && !(r.payments && r.payments[m])).forEach(r => list.push({ref:`rec:${r.id}:${m}`, label:`Mensalidade ${monthLabel(m)} · ${r.clientName} · ${brl(r.monthly)}`, value:r.monthly}));
  return list;
}
function refLabelOf(ref){
  const [t, id, comp] = String(ref || "").split(":");
  if (t === "bk") { const b = S.bookings.find(x => x.id === id); return b ? `${short(b.date)} ${tm(minOf(b))} · ${courtName(b.court)} · ${b.clientName}` : "Reserva removida"; }
  if (t === "rec") { const r = S.recurring.find(x => x.id === id); return r ? `Mensalidade ${monthLabel(comp)} · ${r.clientName}` : "Mensalista removido"; }
  return "Sem reserva vinculada";
}
function noteModal(pre = {}){
  const targets = noteTargets(); if (pre.ref && !targets.some(t => t.ref === pre.ref)) targets.unshift({ref:pre.ref, label:refLabelOf(pre.ref), value:pre.value});
  openModal(`
    <div class="mh"><h2>Anotar pagamento</h2><span class="spacer"></span><button class="btn sm ghost" data-close aria-label="Fechar">✕</button></div>
    <form class="mb" id="nf" novalidate autocomplete="off">
      <p class="muted" style="margin:0;font-size:13px">A anotação vai para os sócios, que conferem e registram o pagamento no sistema.</p>
      <label class="f"><span class="lbl">Referente a</span><select id="nRef"><option value="">Sem reserva vinculada (outro pagamento)</option>${targets.map(t => `<option value="${esc(t.ref)}" data-v="${Number(t.value)||0}"${t.ref===pre.ref?" selected":""}>${esc(t.label)}</option>`).join("")}</select></label>
      <label class="f"><span class="lbl">Valor recebido (R$)</span><input type="number" id="nVal" min="0" step="5" value="${Number(pre.value)||0}"></label>
      <div class="f"><span class="lbl">Forma de pagamento</span>${splitHTML([{m:"pix", v:Number(pre.value)||0}])}</div>
      <label class="f"><span class="lbl">Anotação</span><textarea id="nText" rows="3" placeholder="Ex.: pagou 100 no PIX e 80 em dinheiro; ficou devendo a água">${esc(pre.text||"")}</textarea></label>
      <p class="err" id="nErr" hidden></p>
    </form>
    <div class="mf"><span class="spacer"></span><button class="btn ghost" data-close>Fechar</button><button class="btn pri" id="nSave">Salvar anotação</button></div>`, root => {
    const sp = bindSplit(root, "#nVal");
    $("#nRef",root).addEventListener("change", e => { const o = e.target.selectedOptions[0]; if (o && o.dataset.v) { $("#nVal",root).value = o.dataset.v; $("#nVal",root).dispatchEvent(new Event("input")); } });
    $("#nf",root).addEventListener("submit", e => { e.preventDefault(); $("#nSave",root).click(); });
    $("#nSave",root).addEventListener("click", async () => {
      const err = $("#nErr",root), ref = $("#nRef",root).value, text = $("#nText",root).value.trim(), value = Number($("#nVal",root).value) || 0;
      if (!ref && !text) { err.textContent = "Escreva a anotação ou escolha a reserva."; err.hidden = false; return; }
      const spErr = sp.check(); if (spErr) { err.textContent = spErr; err.hidden = false; return; }
      const data = {text, ref, refLabel: ref ? refLabelOf(ref) : "", value, pays: value ? sp.read() : [], by:S.role, status:"aberta", createdAt:new Date().toISOString()};
      if (await write(() => S.db.collection("cashnotes").add(data), "Anotação salva. Os sócios vão ver.")) closeModal();
    });
  });
}
async function resolveNote(id, how){ await S.db.doc("cashnotes/" + id).update({status:"resolvida", resolvedAt:new Date().toISOString(), resolvedHow:how || "manual"}); }
function vNotas(){
  const f = S.noteF, all = [...S.notes].sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  const list = all.filter(n => f === "todas" || (f === "aberta" ? n.status !== "resolvida" : n.status === "resolvida"));
  const cnt = k => all.filter(n => k === "todas" || (k === "aberta" ? n.status !== "resolvida" : n.status === "resolvida")).length;
  const card = n => {
    const [t, id, comp] = String(n.ref || "").split(":"), b = t === "bk" ? S.bookings.find(x => x.id === id) : null, r = t === "rec" ? S.recurring.find(x => x.id === id) : null;
    const done = n.status === "resolvida", already = (b && b.paid) || (r && r.payments && r.payments[comp]);
    const when = new Date(n.createdAt);
    return `<div class="ncard${done ? " done" : ""}">
      <div class="row"><span class="pill ${n.by === "caixa" ? "acc" : "ex"}">${n.by === "caixa" ? "Caixa" : "Master"}</span><span class="muted" style="font-size:12.5px">${when.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})} às ${when.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</span><span class="spacer"></span>${done ? `<span class="pill ok">Resolvida${n.resolvedHow === "baixa" ? " · pagamento registrado" : ""}</span>` : `<span class="pill warn">Aberta</span>`}</div>
      <b>${esc(n.ref ? refLabelOf(n.ref) : "Sem reserva vinculada")}</b>
      ${n.value ? `<span>${brl(n.value)} · ${esc(payLabel(n.pays || []))}</span>` : ""}
      ${n.text ? `<p class="ntext">${esc(n.text)}</p>` : ""}
      ${!isCaixa() ? `<div class="row">${!done && b && !already ? `<button class="btn sm pri" data-nbx="${esc(n.id)}">Registrar pagamento</button>` : ""}${!done && r && !already ? `<button class="btn sm pri" data-nrx="${esc(n.id)}">Registrar pagamento da mensalidade</button>` : ""}${!done && already ? `<span class="muted" style="font-size:12.5px">Já tem pagamento registrado.</span>` : ""}
        <span class="spacer"></span><button class="btn sm ghost" data-ntog="${esc(n.id)}">${done ? "Reabrir" : "Marcar como resolvida"}</button></div>` : ""}
    </div>`;
  };
  return `
  <section class="row"><h1>Anotações</h1><span class="spacer"></span><button class="btn pri" id="newNote">Nova anotação</button></section>
  <p class="muted" style="margin:0;font-size:13px">${isCaixa() ? "Anote aqui cada pagamento recebido: de quem, quanto e de que forma. Os sócios conferem e registram o pagamento." : "O caixa anota os pagamentos recebidos. Confira, registre o pagamento e a anotação fica resolvida."}</p>
  <div class="seg" style="max-width:420px" role="group" aria-label="Filtrar">${[["aberta","Abertas"],["resolvida","Resolvidas"],["todas","Todas"]].map(([k,l]) => `<button type="button" data-nf="${k}" aria-pressed="${f===k}">${l} (${cnt(k)})</button>`).join("")}</div>
  <div class="nlist">${list.length ? list.map(card).join("") : `<div class="panel empty">${f === "aberta" ? "Nenhuma anotação aberta." : "Nenhuma anotação."}</div>`}</div>`;
}

/* ---------- Excel ---------- */
const UP = s => String(s || "").toLocaleUpperCase("pt-BR");
async function exportExcel(){
  const m = S.month, rc = receipts(m);
  if (!rc.length) { toast("Nenhum pagamento registrado neste mês para exportar."); return; }
  if (typeof XLSX === "undefined") { toast("A biblioteca do Excel não carregou. Verifique a internet e recarregue a página."); return; }
  if (!S.dl) { toast("Exportação indisponível neste navegador."); return; }
  const comp = brDate(lastDayOf(m));
  const rows = rc.map(r => {
    const c = court(r.court), cpfOkd = docOk(r.cpf);
    const detail = r.kind === "Evento" ? `${UP(c.name)} ${UP(c.sport)} - EVENTO${r.eventType?` ${UP(r.eventType)}`:""} ${brDate(r.ref)} ${tm(r.min)} (${r.dur}H)` : r.kind === "Avulso" ? `${UP(c.name)} ${UP(c.sport)} - JOGO ${brDate(r.ref)} ${tm(r.min)}` : `${UP(c.name)} ${UP(c.sport)} - MENSALIDADE ${UP(monthLabel(r.comp))} - ${UP(WD[r.weekday])} ${tm(r.min)}`;
    return {
      "EMITIR": "SIM",
      "COMPETÊNCIA": comp,
      "DATA DO PAGAMENTO": brDate(r.pay),
      "VALOR": Number(r.value.toFixed(2)),
      "FORMA DE PAGAMENTO": UP(payLabel(r.pays)),
      "NOME COMPLETO": UP(r.name),
      "CPF/CNPJ": cpfOkd ? fmtCpf(r.cpf) : "",
      "E-MAIL": String(r.email || "").toLowerCase(),
      "TELEFONE": fmtPhone(r.phone),
      "DESCRIÇÃO DA NOTA": "LOCAÇÃO QUADRA",
      "DETALHE": detail.replace(/\s+/g," ").trim(),
      "TIPO": UP(r.kind),
      "REFERENTE A": r.kind !== "Mensalidade" ? brDate(r.ref) : UP(monthLabel(r.comp)),
      "QUADRA": UP(c.name), "MODALIDADE": UP(c.sport), "HORÁRIO": tm(r.min),
      "CÓDIGO DA RESERVA": r.code || "", "ORIGEM": UP(r.origem)
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [8,13,13,10,14,34,18,30,17,18,52,13,16,12,12,9,15,10].map(w => ({wch:w}));
  ws["!autofilter"] = {ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:rows.length, c:Object.keys(rows[0]).length-1}})};

  const resumo = [["ARENA B12 · RECEBIMENTOS POR DATA DO PAGAMENTO"], ["Mês", UP(monthLabel(m))], ["Competência das notas", comp], [],

async function cvSubmit(){

  if (!emailOk(f.email)) e.email = "Digite um e-mail válido, como nome@email.com.";
  if (digits(f.phone).length < 10) e.phone = "Digite o WhatsApp com DDD.";

  const p = C.pick;

  if (slotAt(p.date,p.min,p.court) || priceOf(p.court,p.date,p.min) == null || !siteOpen(p.date)) { toast("Esse horário não está mais disponível. Escolha outro."); C.step=1; C.pick=null; render(); return; }
  const code = "B12-" + Math.random().toString(36).slice(2,6).toUpperCase();
  const data = {date:p.date, min:p.min, hour:Math.floor(p.min/60), court:p.court, clientName:f.name.trim(), phone:f.phone, cpf:f.cpf, email:f.email.trim(), price:priceOr0(p.court,p.date,p.min),
    paid:false, method:"", paidAt:null, kind:"avulso", status:"ativo", notes:f.notes.trim(), news:!!f.news, origem:"site", teste:true, code, createdAt:new Date().toISOString()};
  let ref = null;
  const exSite = findClient({cpf:data.cpf, phone:data.phone});
  if (exSite && normName(exSite.name) !== normName(data.clientName)) { data.nameDiff = true; data.regName = exSite.name; }
  if (!await write(async () => { data.clientId = await upsertClient({name:data.clientName, cpf:data.cpf, phone:data.phone, email:data.email}, {keepName:true, site:true}); ref = await S.db.collection("bookings").add(data); })) return;
  C.current = {id: ref && ref.id, ...data}; C.step = 3; C.pick = null; C.form = {name:"",cpf:"",email:"",phone:"",notes:"",lgpd:false,news:false};
  render(); window.scrollTo(0,0);
}

function cancelPage(b0){
  const b = liveBk(b0), h = Number(S.cfg.cancelH), canc = b.status === "cancelado", can = !canc && new Date() < cvDeadline(b), m = minOf(b);
  const root = mailShell(`<span>arenab12.com.br/agenda/cancelar?codigo=${esc(b.code)}</span>`, `<div class="mbd" id="cBody">${
    canc ? `<h4>Esta reserva já foi cancelada</h4><p class="muted" style="margin:0">O horário de ${esc(cvShort(b.date))} às ${tm(m)} já está livre.</p>`
    : can ? `<h4>Cancelar sua reserva?</h4><dl class="kv"><dt>Código</dt><dd>${esc(b.code)}</dd><dt>Quando</dt><dd>${esc(cvShort(b.date))} · ${tm(m)}</dd><dt>Quadra</dt><dd>${esc(courtLabel(b.court))}</dd><dt>Responsável</dt><dd>${esc(b.clientName)}</dd></dl>

    : `<h4>Não dá mais para cancelar online</h4><p class="muted" style="margin:0">O cancelamento pelo site vai até ${h}h antes do horário. Fale direto com a Arena pelo WhatsApp para desmarcar.</p>`}</div>`, "page");

const supa = window.supabase.createClient('https://zryazxwxrufzeyaoeqbm.supabase.co', 'sb_publishable_Hux6NxPxXSMnb1gW5gDXzA_j5ja3bhN');
function makeDb(){
  const cache = {}, subs = {}, dsubs = {}, loading = {};
  const snapCol = c => ({docs:[...(cache[c] || new Map())].map(([id, d]) => ({id, exists:true, data:() => d})), metadata:{fromCache:false}});
  const snapDoc = (c, id) => { const d = cache[c] && cache[c].get(id); return {exists: d !== undefined, data:() => d, metadata:{fromCache:false}}; };
  const emit = c => { (subs[c] || []).forEach(f => f(snapCol(c))); Object.entries(dsubs).forEach(([k, fs]) => { const [cc, id] = k.split("/"); if (cc === c) fs.forEach(f => f(snapDoc(cc, id))); }); };
  const load = async c => {
    if (loading[c]) return loading[c];
    loading[c] = (async () => {
      const rows = []; let from = 0;
      for (;;) { const { data, error } = await supa.from("gq_docs").select("id,data").eq("col", c).range(from, from + 999); if (error) throw error; rows.push(...data); if (data.length < 1000) break; from += 1000; }
      cache[c] = new Map(rows.map(r => [r.id, r.data])); emit(c);
    })().finally(() => { loading[c] = null; });
    return loading[c];
  };
  const toErr = e => { const err = new Error(e && e.message || "erro"); err.code = e && (e.code === "42501" || /row-level security/i.test(e.message || "")) ? "invalid_argument" : "unavailable"; return err; };
  const put = async (c, id, data) => {
    const { error } = await supa.from("gq_docs").upsert({col:c, id, data, atualizado_em:new Date().toISOString()});
    if (error) throw toErr(error);
    (cache[c] = cache[c] || new Map()).set(id, data); emit(c);
  };
  const del = async (c, id) => { const { error } = await supa.from("gq_docs").delete().eq("col", c).eq("id", id); if (error) throw toErr(error); if (cache[c]) cache[c].delete(id); emit(c); };
  supa.channel("gq_docs").on("postgres_changes", {event:"*", schema:"public", table:"gq_docs"}, p => {
    const row = p.eventType === "DELETE" ? p.old : p.new; if (!row || !row.col || !cache[row.col]) return;
    if (p.eventType === "DELETE") cache[row.col].delete(row.id); else cache[row.col].set(row.id, row.data);
    emit(row.col);
  }).subscribe();
  setInterval(() => { if (document.visibilityState === "visible") Object.keys(subs).concat(Object.keys(dsubs).map(k => k.split("/")[0])).filter((v,i,a) => a.indexOf(v) === i).forEach(c => load(c).catch(() => {})); }, 60000);
  const colRef = c => { const q = {
      orderBy(){ return q; }, limit(){ return q; },
      onSnapshot(fn, err){ (subs[c] = subs[c] || []).push(fn); if (cache[c]) fn(snapCol(c)); else load(c).catch(e => err && err(e)); return () => {}; },
      async add(d){ const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, "").slice(0, 20); await put(c, id, d); return {id}; }
    }; return q; };
  const docRef = path => { const [c, id] = path.split("/"); return {
      onSnapshot(fn, err){ (dsubs[path] = dsubs[path] || []).push(fn); if (cache[c]) fn(snapDoc(c, id)); else load(c).catch(e => err && err(e)); return () => {}; },
      set: d => put(c, id, d),
      async update(patch){ let cur = cache[c] && cache[c].get(id);
        if (cur === undefined) { const { data, error } = await supa.from("gq_docs").select("data").eq("col", c).eq("id", id).maybeSingle(); if (error) throw toErr(error); cur = data ? data.data : {}; }
        return put(c, id, {...cur, ...patch}); },
      delete: () => del(c, id)
    }; };
  return {collection: colRef, doc: docRef};
}
async function start(){
  render();
  const { data: { session } } = await supa.auth.getSession();
  if (!session) { location.replace("../"); return; }
  // perfil do login: sócio = master; caixa = caixa
  try {
    const { data, error } = await supa.rpc("meu_papel");
    if (!error) {
      if (data === "socio") S.role = "master";
      else if (data === "caixa" || data === "recepcao") S.role = "caixa";
      else { S.noAccess = true; S.db = {}; S.loaded = {cfg:true,bk:true,rc:true,sk:true}; render(); return; }
    }
  } catch(_){}
  const who = document.getElementById("whoami"); if (who) who.textContent = `${session.user.email} · ${S.role === "caixa" ? "Caixa" : "Master"}`;
  const db = makeDb();
  S.db = db;
  S.dl = { save: async ({filename, data}) => { const url = URL.createObjectURL(data); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); } };
  const slow = setTimeout(() => setSync("", "Conexão lenta…"), 10000);
  let firstLive = false;
  const live = meta => { if (!meta.fromCache && !firstLive) { firstLive = true; clearTimeout(slow); setSync("on","Sincronizado"); } };
  const fail = () => { clearTimeout(slow); setSync("off","Erro de conexão"); };
  const editing = () => S.view === "ajustes" && S.mode === "gestao" && document.getElementById("rulesBox");
  db.doc("config/main").onSnapshot(s => { S.cfg = normCfg(s.exists ? s.data() : null); S.loaded.cfg = true; live(s.metadata); if (!editing()) render(); }, fail);
  db.collection("bookings").orderBy("date","desc").limit(1000).onSnapshot(s => { S.bookings = s.docs.map(d => ({id:d.id, ...d.data()})); S.loaded.bk = true; live(s.metadata); if (!editing()) render(); }, fail);
  db.collection("recurring").onSnapshot(s => { S.recurring = s.docs.map(d => ({id:d.id, ...d.data()})); S.loaded.rc = true; live(s.metadata); if (!editing()) render(); }, fail);
  db.collection("clients").onSnapshot(s => { S.clientsReg = s.docs.map(d => ({id:d.id, ...d.data()})); if (!editing()) render(); }, fail);
  db.collection("cashnotes").onSnapshot(s => { S.notes = s.docs.map(d => ({id:d.id, ...d.data()})); if (!editing()) render(); }, fail);
  db.collection("skips").onSnapshot(s => { S.skips = new Set(s.docs.map(d => d.id)); S.loaded.sk = true; if (!editing()) render(); }, fail);
}
start();
})();
